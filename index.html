.hero-logo{width:104px;height:104px;margin:0 auto 14px;border-radius:30px;background:var(--lime);display:grid;place-items:center}
.hero-logo .emblem{width:80px;height:80px}
.wordmark{text-align:center;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.01em;color:var(--ink);margin:0 0 28px}
.cmark{width:38px;height:38px;flex:0 0 auto;border-radius:11px;background:var(--lime);display:grid;place-items:center}
.cmark .emblem{width:30px;height:30px}
.hb{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto}
.hb i,.hb i:before,.hb i:after{display:block;width:16px;height:2px;border-radius:2px;background:var(--ink2)}
.hb i{position:relative}
.hb i:before,.hb i:after{content:"";position:absolute;left:0}
.hb i:before{top:-5px}.hb i:after{top:5px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--card);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{max-width:560px;margin:0 auto;display:flex}
.tabbar button{flex:1 1 0;min-height:60px;font-size:12px;font-weight:700;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--lime)}
[data-theme="light"] .tabbar button[aria-current="page"]{color:var(--violet-t)}
.tabs-on .abar{bottom:calc(60px + env(safe-area-inset-bottom))}
.tabs-on .toast{bottom:calc(82px + env(safe-area-inset-bottom))}
.msheet{--ink:#F5F5F7;--ink2:#B9B9C6;--line:#2E2E40;--soft:#1E1E2B;position:fixed;inset:0;z-index:80;background:#15151F;color:var(--ink);overflow-y:auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom))}
.msheet-in{max-width:560px;margin:0 auto}
.msheet-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.msheet-hd h2{margin:0;font-size:30px;color:var(--ink)}
.msheet-x{min-height:44px;padding:0 18px;border:1.5px solid var(--ink);border-radius:var(--r-pill);color:var(--ink);font-weight:700;font-size:15px}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mgrid button{min-height:96px;text-align:left;padding:14px;border-radius:16px;color:var(--on-tile);font-size:15px;font-weight:800;line-height:1.25}
.mgrid button span{display:block;margin-top:4px;font-size:12.5px;font-weight:500}
.mrows{margin-top:16px;border-top:1.5px solid var(--line);padding-top:6px}
.mrows>button{display:block;width:100%;min-height:48px;padding:0;text-align:left;color:var(--ink);font-size:15px;font-weight:600}
.mrow-sw{display:flex;justify-content:space-between;align-items:center;min-height:52px;font-size:15px;font-weight:700}
.sw{width:52px;height:30px;border-radius:var(--r-pill);border:1.5px solid #8C8CA0;background:var(--soft);padding:3px;display:flex;justify-content:flex-start;flex:0 0 auto}
.sw i{width:22px;height:22px;border-radius:50%;background:var(--ink2)}
.sw[aria-pressed="true"]{border-color:#7357F6;background:#7357F6;justify-content:flex-end}
.sw[aria-pressed="true"] i{background:#FFFFFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
/* A text cursor only where text can be typed. */
body{cursor:default;caret-color:transparent}
input,textarea,select,[contenteditable="true"]{cursor:text;caret-color:auto}
input[type="checkbox"],input[type="radio"],button,a,summary,label.chk{cursor:pointer}
h1{font-family:var(--display);font-size:30px;line-height:1.05;font-weight:800;margin:0 0 8px;letter-spacing:-.02em}
h2{font-family:var(--display);font-size:22px;line-height:1.15;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}
h3{font-family:var(--display);font-size:19px;line-height:1.2;font-weight:800;margin:0}
p{margin:0 0 12px}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* app frame */
.app{max-width:560px;margin:0 auto;padding:0 16px 110px;min-height:100vh}
.top{position:sticky;top:0;background:var(--bg);padding:12px 0 10px;z-index:20}
.topbar{display:flex;align-items:center;gap:12px;min-height:36px}
.back{min-width:44px;height:44px;margin-left:-8px;display:grid;place-items:center;flex:0 0 auto;font-size:22px;font-weight:700;color:var(--lime)}
[data-theme="light"] .back{color:var(--violet-t)}
.back:active{transform:scale(.94)}
.crumb{font-size:12px;color:var(--ink3);font-weight:700;flex:1;text-transform:uppercase;letter-spacing:.1em}
.track{height:8px;background:var(--line);border-radius:99px;margin-top:10px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;
  background:var(--lime);transition:width .45s cubic-bezier(.4,0,.2,1)}
[data-theme="light"] .track i{background:var(--violet)}

/* cards */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card.tint{background:var(--teal-l);border-color:var(--violet)}
.card.warm{background:var(--amber-l);border-color:var(--amber-l)}
.lede{color:var(--ink2);font-size:16px;margin-bottom:16px}
.muted{color:var(--ink3);font-size:14px}
.eyebrow{font-size:11px;font-weight:800;color:var(--violet-t);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--lime);color:var(--on-lime);border-radius:var(--r-pill);padding:12px 24px;font-weight:700;
  min-height:50px;transition:transform .1s,background .12s;font-size:16px}
@media(hover:hover){.btn:not(.sec):not(:disabled):hover{background:var(--lime-h)}}
.btn:active{transform:scale(.97)}
.btn:disabled,.btn.go:disabled,.btn.sec:disabled{background:var(--line);color:var(--ink3);box-shadow:none;cursor:not-allowed;opacity:.7}
.btn.go{background:var(--lime);color:var(--on-lime)}
.btn.sec{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.full{display:flex;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.row .btn{flex:1 1 auto}
.abar{--ink:#F5F5F7;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--slate);color:#fff;border-top:1.5px solid var(--line);
  padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.abar-in{max-width:528px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.abar-txt{font-size:14px;line-height:1.45}
.abar a{color:#fff;text-decoration:underline}
.abar-btns{display:flex;gap:10px}
.abar-btns .btn{flex:1 1 0;min-height:44px;padding:10px 16px}

/* options */
.opt{display:block;width:100%;text-align:left;background:var(--card);border-radius:var(--r-sm);color:var(--ink);
  padding:15px 16px;margin-bottom:10px;line-height:1.45;box-shadow:inset 0 0 0 1.5px var(--line);
  transition:transform .1s,box-shadow .15s,background .15s}
.opt:active{transform:scale(.985)}
.opt.sel{background:var(--violet);color:var(--on-violet);box-shadow:inset 0 0 0 1.5px var(--violet)}
.opt.sel .sub,.opt.sel .tag{color:#EDE9FF}
.opt.ok{background:var(--card);box-shadow:inset 0 0 0 2px var(--tile-mint)}
[data-theme="light"] .opt.ok{box-shadow:inset 0 0 0 2px #0E9F6E}
.opt.no{background:var(--rose-l);box-shadow:inset 0 0 0 2px var(--rose)}
.opt .tag{display:block;font-size:12.5px;color:var(--ink3);font-weight:600;margin-bottom:4px}
.opt .sub{display:block;font-size:13.5px;color:var(--ink2);margin-top:5px}
.opt b{font-weight:700}
@media(hover:hover){.opt:not(.sel):not(.ok):not(.no):not([disabled]):hover{background:var(--soft)}}

/* sign in */
.sso{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  background:transparent;color:var(--ink);border-radius:var(--r-pill);padding:14px;font-weight:700;min-height:52px;
  box-shadow:inset 0 0 0 1.5px var(--ink);margin-bottom:10px}
.sso:active{transform:scale(.98)}
.sso .g{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:700;color:#fff}
.divider{display:flex;align-items:center;gap:12px;color:var(--ink3);font-size:13px;margin:16px 0}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}

/* level chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
  padding:4px 12px;border-radius:var(--r-pill);background:var(--soft);color:var(--ink2);box-shadow:inset 0 0 0 1.5px var(--line)}
.chip.t{background:var(--violet);color:var(--on-violet);box-shadow:none}
.chip.a{background:var(--amber-l);color:var(--amber-d);box-shadow:none}
.chip.i{background:var(--teal-l);color:var(--teal-d);box-shadow:none}

/* domain cards */
.dom{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border-radius:var(--r);
  padding:16px;margin-bottom:10px;box-shadow:inset 0 0 0 1.5px var(--line);transition:transform .1s}
.dom:active{transform:scale(.985)}
.dom-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dom-h b{font-weight:700;font-size:16px;flex:1}
.steps{display:flex;gap:5px}
.step{flex:1;height:8px;border-radius:4px;background:var(--line)}
.step.f{background:var(--lime)}
[data-theme="light"] .step.f{background:var(--violet)}
.step.g{background:transparent;box-shadow:inset 0 0 0 1.5px var(--violet-t)}
.arrow{color:var(--ink3);font-size:18px}

/* streak */
.streak{display:flex;align-items:center;gap:14px;background:var(--tile-coral);color:var(--on-tile);border:0;
  border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.flame{width:56px;height:56px;border-radius:16px;background:var(--tile-coral);display:grid;place-items:center;
  font-family:var(--display);font-size:26px;font-weight:800;color:var(--on-tile);flex:0 0 auto}
.streak b{display:block;font-size:15px}
.streak .muted{color:inherit;opacity:.8}

/* coach */
.coach{background:var(--teal-l);color:var(--ink);border:1.5px solid var(--violet);border-radius:var(--r);padding:17px 18px;margin:14px 0;
  white-space:pre-wrap;line-height:1.62}
.coach h4{margin:0 0 8px;font-size:11px;font-weight:800;color:var(--violet-t);text-transform:uppercase;letter-spacing:.06em}
.why{background:var(--soft);border-radius:var(--r-sm);padding:14px 16px;margin-top:14px;font-size:14.5px;color:var(--ink)}
.why b{color:var(--violet-t);display:block;margin-bottom:4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:800}

/* forms */
textarea,input,select{font-family:inherit;font-size:16px;width:100%;padding:13px 14px;
  border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--card);color:var(--ink);line-height:1.5}
textarea:focus,input:focus{outline:2px solid var(--focus);outline-offset:2px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pdw{margin:6px 0 0;font-size:12.5px;color:var(--amber-d)}
textarea{min-height:120px;resize:vertical}
label.fl{display:block;font-size:12px;font-weight:700;margin:0 0 6px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
.err{color:var(--rose);font-size:14px;margin-top:8px;font-weight:500}

/* checklist */
.chk{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r-sm);margin-bottom:9px;
  background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer}
.chk.on{background:var(--teal-l);box-shadow:inset 0 0 0 1.5px var(--violet)}
.chk input{width:22px;height:22px;flex:0 0 auto;margin:1px 0 0;accent-color:var(--violet)}

/* progress screen */
.tile{background:var(--soft);color:var(--ink);border-radius:16px;padding:14px}
.tile b{display:block;font-family:var(--display);font-size:28px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.tile span{font-size:12.5px;font-weight:600}
.tile.coral,.itile.coral{background:var(--tile-coral);color:var(--on-tile)}
.tile.sky,.itile.sky{background:var(--tile-sky);color:var(--on-tile)}
.tile.mint,.itile.mint{background:var(--tile-mint);color:var(--on-tile)}
.tile.lilac,.itile.lilac{background:var(--tile-lilac);color:var(--on-tile)}
.tile.sand,.itile.sand{background:var(--tile-sand);color:var(--on-tile)}
.itile{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:0 0 auto}
.ico{display:inline-block;vertical-align:-.2em;flex:0 0 auto}
.effort{background:var(--lime);color:var(--on-lime);border-color:var(--lime);display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.effort b{font-family:var(--display);font-size:36px;font-weight:800;line-height:1}
.effort .et{font-size:15px;font-weight:700}
.effort .es{flex-basis:100%;font-size:13.5px;opacity:.8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.nextstep{background:var(--violet);color:var(--on-violet);border-color:var(--violet)}
.nextstep .eyebrow,.nextstep h3{color:var(--on-violet)}
.nextstep .btn.sec{color:var(--on-violet);box-shadow:inset 0 0 0 1.5px var(--on-violet)}
.arow2{display:flex;width:100%;align-items:center;gap:10px;min-height:48px;border-top:1.5px solid var(--line);text-align:left;color:var(--ink);font-size:15px}
.arow2:first-of-type{margin-top:8px}
.arow2>span:first-child{flex:1}
.ptag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--violet-t)}
.ptag.plus{color:var(--amber-d)}
.claimnote{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 18px}
.badge{min-height:104px;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;color:var(--ink3);border:1.5px dashed var(--line)}
.badge b{font-size:13px;line-height:1.2;color:var(--ink2)}
.badge span{font-size:11.5px;line-height:1.3}
.badge.got{border:0;color:var(--on-tile)}
.badge.got b{color:var(--on-tile)}
.sgrp{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--violet-t);margin:22px 0 4px}
.srow{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;min-height:52px;padding:8px 0;border-top:1.5px solid var(--line);text-align:left;color:var(--ink);font-size:15px}
.srow>span:first-child{flex:1;min-width:0}
.srow small{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.srow .v{flex:0 0 auto;font-size:14px;color:var(--ink3);display:inline-flex;align-items:center;gap:6px;max-width:60%;text-align:right}
.srow .vbtn{min-height:44px;color:var(--violet-t);font-weight:700}
.srow.off{opacity:.6}
.srow.danger>span:first-child{color:var(--rose)}
.srow.edit input{flex:1}
.sconfirm{border-top:1.5px solid var(--line);padding:14px 0}
.sconfirm b{color:var(--rose);font-size:15px}
.sconfirm p{margin:6px 0 0;font-size:14px;color:var(--ink2)}
.btn.danger{background:var(--rose);color:#0B0B14}
[data-theme="light"] .btn.danger{color:#FFFFFF}
.card.plan b{font-size:16px}
.agrp{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--violet-t);margin:18px 4px 8px}
.agrp.plus{color:var(--amber-d)}
.acard{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.acard.plus{background:transparent;border-style:dashed}
.ahead{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:16px;min-height:64px;color:var(--ink)}
.aname{font-size:16px;font-weight:700;line-height:1.3}
.asub{display:block;font-size:13px;font-weight:400;color:var(--ink3)}
.arow .asub{display:inline;font-size:14px;color:var(--ink2)}
.alink{flex:0 0 auto;color:var(--violet-t);font-weight:700;font-size:14px;min-height:44px;display:inline-flex;align-items:center}
.lvchip{flex:0 0 auto;background:var(--violet);color:var(--on-violet);border-radius:var(--r-pill);padding:4px 12px;font-size:12px;font-weight:700}
.lvchip.none{background:var(--soft);color:var(--ink2);box-shadow:inset 0 0 0 1.5px var(--line)}
.arow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 16px;padding:4px 0;min-height:48px;border-top:1.5px solid var(--line);font-size:14px;color:var(--ink2)}
.sect{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);margin:22px 4px 8px}
.rows{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden}
.rw{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:56px;border:0;border-top:1.5px solid var(--line);text-align:left;width:100%;background:none;font:inherit;color:var(--ink)}
.rw:first-child{border-top:0}
button.rw{cursor:pointer}
@media(hover:hover){button.rw:hover{background:var(--soft)}}
.rw .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;background:var(--soft);color:var(--ink2)}
.rw .ic.a{background:var(--teal-l);color:var(--violet-t)}
.rw .ic.c{background:var(--amber-l);color:var(--amber-d)}
.rw .tx{flex:1;min-width:0}
.rw .tx b{display:block;font-size:15px;font-weight:700}
.rw .tx span{display:block;font-size:13px;color:var(--ink3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw .chev{color:var(--ink3);font-size:22px;flex:0 0 auto;line-height:1}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink2);flex:0 0 auto;font-size:15px}
.pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--soft);color:var(--ink2);flex:0 0 auto}
.pill.ok{background:var(--violet);color:var(--on-violet)}
.tgl{position:relative;width:46px;height:26px;flex:0 0 auto;border:0;padding:0;border-radius:99px;background:var(--line);cursor:pointer;transition:background .15s}
.tgl.on{background:var(--violet)}
.tgl i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.tgl.on i{left:23px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;z-index:70;padding:24px}
.modal{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:22px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(15,23,42,.3)}
.nedit{display:flex;gap:8px;align-items:center;flex:1}
.nedit input{flex:1}
.fold{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fold>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:12px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary .chev{margin-left:auto;color:var(--ink3);font-size:22px;transition:transform .15s}
.fold[open]>summary .chev{transform:rotate(90deg)}
.fold .fbody{padding:0 16px 16px}
.fold{border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin:14px 0;overflow:hidden}
.fold>summary{list-style:none;cursor:pointer;padding:17px 18px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:17px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary .fx{color:var(--ink3);font-size:13px;font-weight:600}
.fold .fb{padding:0 18px 18px}
.line{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2)}
.line:last-child{border-bottom:0}
.line .nm{flex:1;font-size:15px;font-weight:500;line-height:1.35}
.line .nm span{display:block;font-size:12.5px;color:var(--ink3);font-weight:400}
.note{background:var(--soft);border-radius:var(--r-sm);padding:14px 16px;margin:12px 0;font-size:14.5px;color:var(--ink2)}
.note b{color:var(--ink)}

.toast{position:fixed;left:16px;right:16px;bottom:22px;z-index:60;max-width:528px;margin:0 auto;
  background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 16px;font-size:14.5px;line-height:1.5;
  box-shadow:0 12px 32px rgba(0,0,0,.35);display:flex;gap:11px;align-items:flex-start;
  animation:rise .28s cubic-bezier(.34,1.4,.64,1)}
.toast .ic{flex:0 0 auto;line-height:1}
.toast button{color:#5B3FE0;font-weight:800;flex:0 0 auto;padding:0 0 0 6px;min-height:44px;margin:-12px 0}
[data-theme="light"] .toast button{color:#B3A1FF}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;
  border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pop{animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.offbar{position:fixed;left:0;right:0;top:0;z-index:65;background:var(--amber-l);color:var(--amber-d);
  border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;font-size:13.5px;line-height:1.4;text-align:center}
body.is-offline{padding-top:calc(54px + env(safe-area-inset-top))}
.inst{display:flex;gap:12px;align-items:center}
.inst img{width:44px;height:44px;border-radius:10px;flex:0 0 auto;border:1px solid var(--line)}
.inst .tx{flex:1;font-size:14px;color:var(--ink2);line-height:1.4}
.inst .tx b{display:block;color:var(--ink);font-size:15px}
.isteps{text-align:left;margin:10px 0 16px;padding-left:20px;color:var(--ink2);font-size:14.5px;line-height:1.5}
.isteps li{margin:6px 0}
@media(min-width:620px){.app{padding:0 24px 110px}h1{font-size:34px}}
.sidebar{display:none}
@media(min-width:1024px){
  .side-on #app{padding-left:256px}
  .side-on .app{max-width:808px;padding:0 24px 60px}
  .side-on .app.wide{max-width:1128px}
  .side-on .tabbar,.side-on .hb,.side-on .top .cmark{display:none}
  .side-on .abar{left:256px}
  .side-on .toast{left:272px}
  .side-on h1{font-size:44px;line-height:1}
  .sidebar{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:256px;z-index:50;overflow-y:auto;
    background:var(--card);border-right:1.5px solid var(--line);padding:24px 16px}
  .sb-logo{display:flex;align-items:center;gap:10px;padding:0 8px;margin-bottom:28px}
  .sb-logo b{font-family:var(--display);font-weight:800;font-size:22px;color:var(--ink)}
  .sb-logo .cmark{width:40px;height:40px;border-radius:12px}
  .sb-logo .cmark .emblem{width:32px;height:32px}
  .sb-nav{display:flex;flex-direction:column;gap:2px}
  .sb-nav button{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:12px;font-size:15px;font-weight:500;color:var(--ink2);text-align:left}
  .sb-nav button i{width:8px;height:8px;border-radius:50%;background:transparent;flex:0 0 auto}
  .sb-nav button[aria-current="page"]{font-weight:700;color:var(--ink);background:var(--teal-l)}
  .sb-nav button[aria-current="page"] i{background:var(--lime)}
  [data-theme="light"] .sb-nav button[aria-current="page"] i{background:var(--violet)}
  @media(hover:hover){.sb-nav button:not([aria-current]):hover{background:var(--soft);color:var(--ink)}}
  .sb-fill{flex:1;min-height:24px}
  .sb-plan{background:var(--soft);border-radius:16px;padding:14px;margin-bottom:8px}
  .sb-plan-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .sb-plan-h b{font-size:14px;color:var(--ink)}
  .sb-plan p{margin:6px 0 0;font-size:13px;color:var(--ink2)}
  .sb-sw{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 12px;font-size:14px;font-weight:600;color:var(--ink)}
  .sb-foot{display:block;width:100%;min-height:40px;padding:0 12px;text-align:left;font-size:14px;color:var(--ink2)}
  .statrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,3fr);gap:16px;margin-bottom:24px}
  .statrow .card,.statrow .grid{margin:0}
  .pcols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:0 24px;align-items:start}
  .pcols>*{grid-column:2}
  .pcols>.lvl{grid-column:1;grid-row:1/span 4}
  .agrid.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
  .pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
  .pgrid .opt{margin:0;height:100%}
  .bgrid{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"></div>
<script>
/* Language. ?lang=nl or ?lang=en sets it and remembers it. Without a stored choice the
   browser language decides while NL_AUTO is true. */

<script>
/* Translates the app text after it is written to the page. Keys are the English texts,
   values the Dutch ones. {0} placeholders match any value; the value itself is translated
   too when it is a key. Inline <b>, <strong>, <i>, <em> and <br> may sit inside a key.
   Only runs for Dutch. With ?i18n=debug, untranslated English is collected in window.__i18nMiss. */
(function(){
if(window.BRIG_LANG!=='nl'||!window.BRIG_STRINGS)return;
var D=window.BRIG_STRINGS,EX={},PAT=[],INL={B:1,STRONG:1,I:1,EM:1,BR:1},SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1,INPUT:1,CODE:1,PRE:1},
    ATTR=['placeholder','aria-label','title','alt'],DEBUG=/i18n=debug/.test(location.search);
window.__i18nMiss=new Set();
function norm(t){return String(t).replace(/\s+/g,' ').trim();}
function rx(t){return t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
Object.keys(D).forEach(function(k){var v=D[k],nk=norm(k);if(!v)return;
  if(/\{\d+\}/.test(nk)){var order=[],re='^'+nk.split(/(\{\d+\})/).map(function(p){var m=p.match(/^\{(\d+)\}$/);
    if(m){order.push(+m[1]);return '(.*?)';}return rx(p);}).join('')+'$';
    PAT.push({re:new RegExp(re),order:order,v:v,len:nk.replace(/\{\d+\}/g,'').length});}
  else EX[nk]=v;});
PAT.sort(function(a,b){return b.len-a.len;});
function tr(s){var n=norm(s);if(!n)return null;if(Object.prototype.hasOwnProperty.call(EX,n))return EX[n];
  for(var i=0;i<PAT.length;i++){var m=n.match(PAT[i].re);if(m){var val={};PAT[i].order.forEach(function(ix,j){var c=m[j+1];
    val[ix]=Object.prototype.hasOwnProperty.call(EX,norm(c))?EX[norm(c)]:c;});
    return PAT[i].v.replace(/\{(\d+)\}/g,function(x,d){return d in val?val[d]:x;});}}
  return null;}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function sig(el){var out='',txt=false,tags=false;for(var c=el.firstChild;c;c=c.nextSibling){
  if(c.nodeType===3){out+=c.nodeValue;if(/\S/.test(c.nodeValue))txt=true;}
  else if(c.nodeType===1){if(!INL[c.tagName])return null;tags=true;var t=c.tagName.toLowerCase();
    if(t==='br'){out+='<br>';continue;}var s=sig(c);if(!s)return null;out+='<'+t+'>'+s.s+'</'+t+'>';if(s.txt)txt=true;}}
  return {s:out,txt:txt,tags:tags};}
function build(v,el){var q={};el.querySelectorAll('b,strong,i,em').forEach(function(e){var t=e.tagName.toLowerCase();
  (q[t]=q[t]||[]).push(e.outerHTML.slice(0,e.outerHTML.indexOf('>')+1));});
  return v.split(/(<\/?(?:b|strong|i|em)>|<br>)/).map(function(p,i){if(i%2===0)return esc(p);
    var m=p.match(/^<(b|strong|i|em)>$/);return m&&q[m[1]]&&q[m[1]].length?q[m[1]].shift():p;}).join('');}
function miss(t){if(DEBUG&&/[A-Za-z]{3,}/.test(t))window.__i18nMiss.add(norm(t));}
function attrs(el){ATTR.forEach(function(a){var v=el.getAttribute&&el.getAttribute(a);if(v){var t=tr(v);if(t)el.setAttribute(a,t);else miss(v);}});}
/* Fallback for text the app glues together: keep a leading symbol such as ↑ or ★, and translate
   the parts around " · " one by one. */
function trText(v){var t=tr(v);if(t!==null)return t;var n=norm(v),m=n.match(/^([^A-Za-z0-9{]+)(.+)$/);
  if(m){var r=trText(m[2]);if(r!==null)return m[1]+r;}
  if(n.indexOf(' · ')>0){var ps=n.split(' · '),hit=false;ps=ps.map(function(p){var x=trText(p);if(x!==null){hit=true;return x;}return p;});
    if(hit)return ps.join(' · ');}
  return null;}
function text(n){var v=n.nodeValue;if(!/\S/.test(v))return;var t=trText(v);
  if(t){var lead=v.match(/^\s*/)[0],trail=v.match(/\s*$/)[0];n.nodeValue=lead+t+trail;}else miss(v);}
function visit(n){
  if(n.nodeType===3){if(!(n.parentNode&&SKIP[n.parentNode.tagName]))text(n);return;}
  if(n.nodeType!==1||SKIP[n.tagName]||n.hasAttribute('data-no-i18n'))return;
  attrs(n);
  var s=sig(n);
  if(s&&s.txt&&s.tags){var t=tr(s.s);if(t){n.innerHTML=build(t,n);return;}}
  for(var c=n.firstChild;c;){var nx=c.nextSibling;visit(c);c=nx;}}
var busy=false,obs=new MutationObserver(function(ms){if(busy)return;busy=true;try{ms.forEach(function(m){
  if(m.type==='childList')m.addedNodes.forEach(visit);else if(m.type==='characterData')visit(m.target);
  else if(m.type==='attributes')attrs(m.target);});}finally{obs.takeRecords();busy=false;}});
obs.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:ATTR});
window.brigI18n={tr:tr};
})();
</script>

<script>
/* Content lives in /content/brigvanti-content.js. Update it with tools/build_content.py. */
if(!window.BRIG_CONTENT){document.getElementById('app').innerHTML='<p style="padding:24px">The content could not load. Please refresh the page.</p>';throw new Error('brigvanti content missing');}
const DATA = window.BRIG_CONTENT;
const LV=['No level yet','Aware','Explorer','Integrator','Creator'];
/* Violet marks a level the learner has shown. "No level yet" stays neutral, so it never reads as a level. */
const lvc=n=>n?'chip t':'chip';
/* The first level a skill can be tested at. Skills with a higher floor start there. */
const nextLv=cid=>{const c=byId[cid],cur=(S.scan[cid]&&S.scan[cid].confirmed)||0;return Math.max(cur+1,c.fl);};
const KEY='brigvanti_pilot_v2';
let REMIND_GO=(function(){try{const q=new URLSearchParams(location.search),k=q.get('remind');
  if(k){q.delete('remind');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:''));}return k;}catch(e){return null;}})();
const byId={}; DATA.comps.forEach(c=>byId[c.id]=c);
const itemsOf=(c,l,f)=>DATA.items.find(x=>x.c===c&&x.l===l&&x.f===f);
const formsAt=(c,l)=>DATA.items.filter(x=>x.c===c&&x.l===l).map(x=>x.f);
const compsOf=d=>DATA.comps.filter(c=>c.d===d);
const DK=Object.keys(DATA.doms);
const TOPICS=[...new Set(DATA.acts.map(a=>a.t))];
const AMB=[[2,'Confident with the basics','I want AI to be genuinely useful in daily life.'],
           [3,'Genuinely capable','I want to build things with it and judge them well.'],
           [4,'Able to guide others','I want to help other people use it well.']];
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

let S=null, V={}, LAST=-1, NAV=[], EXITING=false;

function fresh(){return{
  signed:false,email:'',name:'',mode:null,role:null,ambition:null,topics:[],targets:{},r1:null,r2:null,entry:1,
  scan:{},seen:{},reps:[],rung:{},rewards:[],domSeen:{},focus:'',badges:{},flags:{},
  plan:'free',notify:false,authProvider:'',
  stage:0,dom:null,consent:false,analytics:null,analyticsAt:null,started:new Date().toISOString()
};}
/* ---------- cross-device sync engine ----------
   State is one JSON blob per user. Two devices can each hold a full copy,
   so a blind overwrite would lose the other device's progress. Every read
   and write merges the two copies instead. Progress only ever grows:
   finished scans, earned levels, badges, portfolio pieces and rewards are
   unioned and never regress. Settings take the newer edit. The current
   screen stays on the device you are looking at, so a save on your phone
   never yanks the laptop to another page. */
const SETTINGS=['name','email','mode','role','ambition','topics','targets','r1','r2','entry','roleSkipped','analytics','analyticsAt','plan','notify'];
/* NAV fields stay device-local and are never copied from the other device:
   stage, dom, back7, authMode, focus. pw is never persisted at all. */
function serialize(s){ const c=Object.assign({},s); delete c.pw; return JSON.stringify(c); }
function parseBlob(str){ if(str==null) return null; try{ const o=JSON.parse(str); return (o&&o.scan)?o:null; }catch(e){ return null; } }
function mmax(a,b){ const o=Object.assign({},a); Object.keys(b||{}).forEach(function(k){ o[k]=Math.max(o[k]||0,b[k]||0); }); return o; }
function mergeScan(a,b){
  const out={},keys=new Set(Object.keys(a||{}).concat(Object.keys(b||{})));
  keys.forEach(function(k){
    const x=a[k],y=b[k];
    if(!x){out[k]=y;return;} if(!y){out[k]=x;return;}
    const xd=!!x.done,yd=!!y.done; let base=x,other=y;
    if(yd&&!xd){base=y;other=x;}
    else if(xd===yd&&(y.confirmed||0)>(x.confirmed||0)){base=y;other=x;}
    const m=Object.assign({},base);
    m.done=xd||yd; m.skipped=!!(x.skipped||y.skipped);
    m.confirmed=Math.max(x.confirmed||0,y.confirmed||0);
    m.claimed=(base.claimed!=null)?base.claimed:other.claimed;
    out[k]=m;
  });
  return out;
}
function mergeRung(a,b){
  const out={},keys=new Set(Object.keys(a||{}).concat(Object.keys(b||{})));
  keys.forEach(function(k){
    const x=a[k]||{},y=b[k]||{};
    const passed=!!(x.passed||y.passed),at=Math.max(x.at||0,y.at||0);
    const src=(y.passed&&(y.at||0)>=(x.at||0))?y:x;
    out[k]=Object.assign({},x,y,{passed:passed,at:at,t:src.t,ev:src.ev,grew:src.grew});
  });
  return out;
}
function mergeBadges(a,b){ const o=Object.assign({},a); Object.keys(b||{}).forEach(function(k){ o[k]=(o[k]==null)?b[k]:Math.min(o[k],b[k]); }); return o; }
function mergeFlags(a,b){
  const o=Object.assign({},a);
  Object.keys(b||{}).forEach(function(k){
    const bv=b[k];
    if(o[k]==null){o[k]=bv;return;}
    if(typeof bv==='number'||typeof o[k]==='number') o[k]=Math.max(o[k]||0,bv||0);
    else o[k]=!!(o[k]||bv);
  });
  return o;
}
function mergeArr(a,b,keyf){
  const seen={},out=[];
  (a||[]).concat(b||[]).forEach(function(x){ const k=keyf(x); if(!seen[k]){seen[k]=1;out.push(x);} });
  out.sort(function(p,q){return (p.t||0)-(q.t||0);});
  return out;
}
/* base is always the copy on this device, so this device keeps its own
   screen and its own latest settings. Progress is unioned either way. */
function mergeState(base,inc){
  if(!base) return inc||null;
  if(!inc) return base;
  const br=base.resetAt||0,ir=inc.resetAt||0;
  if(ir>br) return Object.assign({},inc);
  if(br>ir) return base;
  const out=Object.assign({},base);
  const bt=base.updated||0,it=inc.updated||0,incNewer=it>bt;
  SETTINGS.forEach(function(k){
    if(inc[k]===undefined) return;
    var bv=base[k];
    var baseEmpty=(bv===undefined||bv===null||bv===''||(Array.isArray(bv)&&!bv.length)||(typeof bv==='object'&&bv&&!Array.isArray(bv)&&!Object.keys(bv).length));
    if(incNewer||baseEmpty) out[k]=inc[k];
  });
  if(out.r1!==null&&out.r1!==undefined) out.entry=out.r1<=1?1:2;
  out.consent=!!(base.consent||inc.consent);
  out.signed=!!(base.signed||inc.signed);
  if(inc.started&&(!base.started||inc.started<base.started)) out.started=inc.started;
  out.scan=mergeScan(base.scan||{},inc.scan||{});
  out.seen=Object.assign({},inc.seen||{},base.seen||{});
  out.domSeen=mmax(base.domSeen||{},inc.domSeen||{});
  out.rung=mergeRung(base.rung||{},inc.rung||{});
  out.badges=mergeBadges(base.badges||{},inc.badges||{});
  out.flags=mergeFlags(base.flags||{},inc.flags||{});
  out.reps=mergeArr(base.reps||[],inc.reps||[],function(r){return r.c+'|'+r.aid+'|'+r.t;});
  out.rewards=mergeArr(base.rewards||[],inc.rewards||[],function(r){return r.c+'|'+r.lv+'|'+r.t;});
  out.updated=Math.max(bt,it);
  return out;
}
/* The Firebase layer at the foot of the file calls these. */
window.brigMerge={ mergeState:mergeState, parseBlob:parseBlob, serialize:serialize };

}

/* Reset erases progress but keeps the sign in. The server copy is replaced
   before anything changes here, so a failed write leaves the account as it was.
   resetAt stops another device from merging old progress back in. */
async function resetAccount(){
  if(V.busyReset)return;
  V.busyReset=true;render();
  const n=fresh();
  ['email','authProvider','consent','analytics','analyticsAt'].forEach(k=>{n[k]=S[k];});
  n.signed=true;n.stage=1;n.resetAt=Date.now();n.updated=n.resetAt;
  try{ await window.storage.replace(KEY,serialize(n)); }
  catch(e){ V.busyReset=false;V.reset=false;render();toast('Your account could not be reset. Nothing was changed. Please try again.');return; }
  let pushOk=true;
  try{ if(window.brigReminders)await window.brigReminders.deleteAll(); await unsubHere(); }catch(e){ pushOk=false; }
  RM.devices=[];
  S=n;V={};NAV=[];LAST=-1;render();
  toast(pushOk?'Your account is reset. You can start again.'
    :'Your progress is reset. Push reminders could not be switched off, so switch them off in Account settings.');
}

/* ---------- scan record ---------- */
function rec(cid){
  if(!S.scan[cid])S.scan[cid]={claimed:null,confirmed:null,probe:null,log:[],done:false};
  return S.scan[cid];
}
const markSeen=(c,l,f)=>{S.seen[c+'|'+l+'|'+f]=1;};
const wasSeen=(c,l,f)=>!!S.seen[c+'|'+l+'|'+f];

/* Adaptive. Two forms at a level, both must be correct.
   First wrong answer ends the level immediately, saving a question. */
function startProbe(cid,level){
  const c=byId[cid],r=rec(cid),lv=Math.max(level,0);
  if(lv<c.fl){r.confirmed=0;r.done=true;r.probe=null;return;}
  const f=formsAt(cid,lv).filter(x=>x!=='c');
  r.probe={lv,forms:f.length>=2?f.slice(0,2):formsAt(cid,lv).slice(0,2),ix:0,fail:false};
}
function answerProbe(cid,pick){
  const r=rec(cid),p=r.probe,it=itemsOf(cid,p.lv,p.forms[p.ix]);
  const ok=pick===it.k;
  if(!ok)p.fail=true;
  markSeen(cid,p.lv,p.forms[p.ix]);
  r.log.push({item:it.i,lv:p.lv,form:p.forms[p.ix],ok,t:Date.now()});
  return {ok,it};
}
function advanceProbe(cid){
  const c=byId[cid],r=rec(cid),p=r.probe;
  if(p.fail){
    if(p.lv-1<c.fl){r.confirmed=0;r.done=true;r.probe=null;}
    else startProbe(cid,p.lv-1);
    return;
  }
  p.ix++;
  if(p.ix>=p.forms.length){r.confirmed=p.lv;r.done=true;r.probe=null;}
}
/* Where to start a competence: what the person claimed, informed by the
   levels already confirmed in this domain. */
function entryFor(cid){
  const c=byId[cid],seen=S.domSeen[c.d];
  let lv=S.entry;
  if(seen!=null)lv=seen;
  return Math.max(c.fl,Math.min(4,lv));
}
function noteDomain(cid){
  const c=byId[cid],v=S.scan[cid].confirmed;
  if(v!=null&&v>0)S.domSeen[c.d]=v;
}

/* ---------- rollups ---------- */
function domLevel(d){
  const cs=compsOf(d).filter(c=>S.scan[c.id]&&S.scan[c.id].done&&!S.scan[c.id].skipped);
  if(!cs.length)return null;
  const v=cs.map(c=>S.scan[c.id].confirmed||0).sort((a,b)=>a-b);
  return v[Math.floor((v.length-1)/2)];
}
const domTarget=d=>S.targets[d]||0;
const domDone=d=>compsOf(d).every(c=>S.scan[c.id]&&S.scan[c.id].done);
const domCount=d=>compsOf(d).filter(c=>S.scan[c.id]&&S.scan[c.id].done).length;
const scanned=()=>DATA.comps.filter(c=>S.scan[c.id]&&S.scan[c.id].done).length;
function gaps(){
  return DK.map(d=>({d,cur:domLevel(d),tgt:domTarget(d)}))
    .filter(x=>x.cur!==null&&x.tgt>x.cur).sort((a,b)=>(b.tgt-b.cur)-(a.tgt-a.cur));
}

/* ---------- practice assignments ---------- */
const dayKey=t=>{const d=new Date(t);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function streak(){
  if(!S.reps.length)return 0;
  const days=[...new Set(S.reps.map(r=>dayKey(r.t)))].sort().reverse();
  const cur=new Date();let n=0;
  if(days[0]!==dayKey(cur)){cur.setDate(cur.getDate()-1);if(days[0]!==dayKey(cur))return 0;}
  for(const d of days){if(d===dayKey(cur)){n++;cur.setDate(cur.getDate()-1);}else break;}
  return n;
}
const repsFor=cid=>S.reps.filter(r=>r.c===cid);
const RAMP=[1,3,5,7];
function nextDue(cid){
  const rs=repsFor(cid);if(!rs.length)return null;
  const d=new Date(rs[rs.length-1].t);
  d.setDate(d.getDate()+RAMP[Math.min(rs.length,RAMP.length)-1]);

  if(n>=10)award('ten');

  if(tg.length&&tg.every(d=>{const c=domLevel(d);return c!==null&&c>=domTarget(d);}))award('aim');

/* ---------- analytics consent gate ----------
   Google Analytics (GA4) stays off until the learner opts in, and can be
   switched off again. gtag loads only from inside enableAnalytics, so no Google
   script runs and no cookie is set until consent is given. Advertising and
   Google Signals are off, so this is analytics only. Turning it off sets
   Google's own ga-disable flag and clears the GA cookies. */
const ANALYTICS_LIVE=true;
const GA_ID='G-EN5GQLEC5Q';
function analyticsAllowed(){ return !!(S&&S.analytics===true); }
function enableAnalytics(){
  if(!ANALYTICS_LIVE||!analyticsAllowed()||window.__brigAnalyticsOn) return;
  window.__brigAnalyticsOn=true;
  window['ga-disable-'+GA_ID]=false;
  const s=document.createElement('script');
  s.async=true; s.src='https://www.googletagmanager.com/gtag/js?id='+GA_ID;
  document.head.appendChild(s);
  window.dataLayer=window.dataLayer||[];
  window.gtag=function(){ window.dataLayer.push(arguments); };
  window.gtag('js',new Date());
  window.gtag('config',GA_ID,{allow_google_signals:false,allow_ad_personalization_signals:false});
}
function disableAnalytics(){
  window.__brigAnalyticsOn=false;
  window['ga-disable-'+GA_ID]=true;
  try{
    document.cookie.split(';').forEach(function(c){
      const n=c.split('=')[0].trim();
      if(n==='_ga'||n.indexOf('_ga_')===0||n==='_gid'||n.indexOf('_gat')===0){
        const base=n+'=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/;';
        document.cookie=base;
        document.cookie=base+' domain='+location.hostname+';';
        document.cookie=base+' domain=.'+location.hostname+';';
      }
    });
  }catch(e){}
}
function setAnalytics(v){
  if(!S) return;
  S.analytics=!!v; S.analyticsAt=Date.now();
  if(v) enableAnalytics(); else disableAnalytics();
  save();render();
}

  const c=pending.find(x=>S.scan[x.id]&&S.scan[x.id].claimed!=null)||pending.find(x=>x.id===S.scanPick)||pending[0],r=rec(c.id);
  if(c.id===S.scanPick)S.scanPick=null;
  if(r.claimed===null)return vClaim(c,d,cs);
  if(!r.probe&&!r.done)startProbe(c.id,r.claimed);
  if(r.done){noteDomain(c.id);save();return vScan();}

function claim(cid,l){
  const r=rec(cid),c=byId[cid];
  V.earned=null;
  r.claimed=l;
  if(l<c.fl){r.claimed=0;r.confirmed=0;r.done=true;noteDomain(cid);mirrorTick(cid);checkBadges();if(domDone(c.d))V.areaDone=c.d;}
  else startProbe(cid,Math.min(l,entryFor(cid)===l?l:l));
  save();render();
}

function vProve(c,d,cs){
  const p=S.scan[c.id].probe,it=itemsOf(c.id,p.lv,p.forms[p.ix]);
  const done=cs.length-cs.filter(x=>!(S.scan[x.id]&&S.scan[x.id].done)).length;
  const pct=Math.round(done/cs.length*100);
  const sh=V.shown;
  const opts=it.o.map((o,i)=>{
    let cl='opt';
    if(sh){if(i===it.k)cl+=' ok';else if(i===V.pick)cl+=' no';}
    else if(V.pick===i)cl+=' sel';
    return `<button class="${cl}" ${sh?'disabled':''} onclick="${sh?'':`V.pick=${i};render()`}">${esc(o)}</button>`;
  }).join('');
  return shell(`<div class="eyebrow">${esc(DATA.doms[d])}</div>
  <h2>${esc(c.n)}</h2>
  <div class="card" style="margin-top:14px"><p style="font-size:17px;font-weight:500;margin-bottom:16px">${esc(it.s)}</p>${opts}
  ${sh?`<div class="why pop"><b>${V.ok?'That is correct':'Not this time'}</b>${esc(it.w)}</div>
    <div class="row"><button class="btn go full" onclick="nextProbe('${c.id}')">Continue</button></div>`
   :`<div class="row"><button class="btn full" ${V.pick==null?'disabled':''} onclick="submitProbe('${c.id}')">Check my answer</button></div>`}</div>`,
  {crumb:`Skill ${done+1} of ${cs.length}`,pct});
}
function submitProbe(cid){if(V.pick==null)return;const{ok}=answerProbe(cid,V.pick);V.shown=true;V.ok=ok;save();render();}
function mirrorTick(cid){
  const r=S.scan[cid];if(!r||r.skipped||r.claimed==null)return;
  /* A claim below the floor was never tested, so it neither counts nor breaks the run. */
  if(r.claimed<byId[cid].fl)return;
  if(!S.flags)S.flags={};
  S.flags.mirror=(r.claimed===r.confirmed)?(S.flags.mirror||0)+1:0;
  S.flags.mirrorBest=Math.max(S.flags.mirrorBest||0,S.flags.mirror);
}
function nextProbe(cid){
  advanceProbe(cid);const r=S.scan[cid];
  if(r.done){noteDomain(cid);mirrorTick(cid);}
  /* Clear the view state on every step. A badge earned as this skill completes
     shows on the next screen, then clears when the learner moves on. */
  V={};if(r.done){checkBadges();if(domDone(byId[cid].d))V.areaDone=byId[cid].d;}
  save();render();
}

  <p class="muted" id="coachLeftPractice" style="margin:0 0 12px;display:none"></p>

  ${toScan.length?`<div class="card" style="margin-top:14px"><h3>Scan first</h3>
    <p class="muted" style="margin:6px 0 10px">Practice in these areas opens when every skill in them is scanned.</p>
    ${toScan.map(d=>`<div class="arow" style="margin:0"><span>${esc(DATA.doms[d])}<span class="claimnote">${domCount(d)} of ${compsOf(d).length} skills scanned</span></span>

async function buildBrief(fresh){

  try{R.brief=await claude({purpose:'brief',actId:R.a.id,compId:R.c.id,tgt:R.tgt,sit:R.sit.trim(),assignmentKey:`${R.a.id}:${R.c.id}:${R.tgt}`,fresh:fresh===true},true);R.step='do';}
  catch(e){R.ceiling=!!e.rebuildLimit;R.err=coachErr(e,'Your coach could not be reached. Check your connection and try again.');}
  R.busy=false;render();
}
async function submitRep(){
  const R=V.rep;
  if(R.prompt.trim()&&R.back.trim().length<40){
    R.err='You used a prompt, so please paste the real answer in box 2. Your coach needs the actual wording to give useful feedback.';render();return;}
  if((R.back+R.did).trim().length<15){
    R.err='Please fill in box 2 or box 3 before sending. Box 1 is optional.';render();return;}
  R.err='';R.busy=true;render();
  try{R.coach=await claude({purpose:'feedback',actId:R.a.id,compId:R.c.id,tgt:R.tgt,sit:R.sit,assignment:R.brief.do,good:R.brief.good,prompt:R.prompt,back:R.back,did:R.did});R.step='coach';}
  catch(e){R.err=coachErr(e,'Your coach could not be reached. Your work is safe. Please try again.');}
  R.busy=false;render();
}
function logRep(){
  const R=V.rep,now=Date.now();
  if(!S.flags)S.flags={};
  const due=nextDue(R.c.id);
  if(due&&now>=due.getTime())S.flags.cameBack=true;
  if(S.reps.length){
    const last=Math.max.apply(null,S.reps.map(r=>r.t));
    if(now-last>=7*864e5)S.flags.backOnIt=true;
  }
  S.reps.push({c:R.c.id,aid:R.a.id,act:R.a.a,tgt:R.tgt,sit:R.sit,
    prompt:R.prompt,back:R.back,did:R.did,coach:R.coach,reflect:R.reflect||'',t:now});
  R.step='done';checkBadges();save();render();
}

function ruAnswer(){

  markSeen(R.cid,R.tgt,R.forms[R.ix]);
  rec(R.cid).log.push({item:it.i,lv:R.tgt,form:R.forms[R.ix],ok,up:true,t:Date.now()});
  R.shown=true;save();render();
}
function ruNext(){

function viewKey(){

  return [S.stage,V.skills?'skills':'',V.pf||'',V.lvArea||'',
    r?'rep:'+r.step:'',u?'ru:'+u.step+':'+u.ix:'',
    S.stage===2?(S.dom||'')+':'+scanned():''].join('|');
}
/* Every placed skill must have been tested by keyed questions. Records without a test
   (skipped, or "None of these fit" before 10 November 2026) count as not scanned.
   A passed level up test always stays. */
function dropUntested(){
  if(!S||!S.scan)return;
  Object.keys(S.scan).forEach(id=>{const r=S.scan[id];
    if(r&&r.done&&(r.skipped||!(r.log&&r.log.length))&&!(S.rung[id]&&S.rung[id].passed))delete S.scan[id];});
}
function render(){
  coachSoon();
  dropUntested();
  if(window.__brigAuthPending){
    var a=document.getElementById('app');
    if(a)a.innerHTML='<div class="app"><p class="muted" style="padding:56px 0 20px">Connecting...</p></div>';
    window.__brigRendered=true;return;
  }
  if(!S.signed&&S.stage!==7)S.stage=0;
  const v=[vAccess,vStart,vScan,vStand,vPractice,vRung,vProgress,vLegal,vPortfolio,vAccount,vBadges][S.stage]||vAccess;
  const key=viewKey(), y=window.scrollY, moved=key!==LAST, app=document.getElementById('app');
  /* On a screen change, scroll up before swapping content and nudge a repaint.
     Android Chrome could leave a stale picture of a long screen below a shorter one. */
  if(moved)window.scrollTo(0,0);
  app.innerHTML=v()+(V.leaving?leavingOverlay():'')+(V.instHelp?installHelp():'');
  document.body.classList.toggle('tabs-on',!!app.querySelector('.tabbar'));
  document.body.classList.toggle('side-on',!!app.querySelector('.sidebar'));
  document.body.style.overflow=V.menu?'hidden':'';
  if(moved){
    LAST=key;window.scrollTo(0,0);
    app.style.opacity='0.999';
    requestAnimationFrame(function(){app.style.opacity='';});
  }
  else window.scrollTo(0,y);
}
function leavingOverlay(){
  return `<div class="modal-bg" onclick="V.leaving=false;render()"><div class="modal" onclick="event.stopPropagation()">
    <h3>You are leaving the app</h3>
    <p class="muted" style="margin:8px 0 16px">Do you want to leave?</p>
    <div class="row"><button class="btn sec" style="flex:1" onclick="V.leaving=false;render()">No, stay</button>
    <button class="btn" style="flex:1" onclick="doExit()">Yes, leave</button></div></div></div>`;
}
function doExit(){ V.leaving=false; render(); signOutUser(); }
/* Boot is driven by the Firebase auth layer below.
   onSignedIn loads the user's stored state; onSignedOut returns to sign in. */
window.brigvantiApp={
  async onSignedIn(user){
    await load();
    S.signed=true;
    if(user&&user.email&&!S.email)S.email=user.email;
    S.authProvider=(user&&user.providerData&&user.providerData[0]&&user.providerData[0].providerId)||'';
    S.stage=setupDone()?6:1;NAV=[];
    if(REMIND_GO&&setupDone()){NAV=[6];S.stage=REMIND_GO==='levelup'?5:REMIND_GO==='scan'?2:4;}
    REMIND_GO=null;
    LAST=-1;render();
    save();
    enableAnalytics();
    remindInit();
    /* Pull the server copy in the background. When it arrives, merge it in and
       refresh. Login never waits on this, so a slow or down server does not
       hold up the screen. */
    window.storage.syncFromServer(KEY).then(function(merged){
      if(merged){
        S=mergeState(S,merged);
        if(S.stage===1&&!NAV.length&&setupDone())S.stage=6;
        LAST=-1;render(); save(); enableAnalytics();
      }
    }).catch(function(){});
  },
  onSignedOut(){
    RM.loaded=false;RM.devices=[];
    S=fresh();V={};LAST=-1;NAV=[];render();
  },
  /* A change arrived from another device. Merge in its progress, keep our own
     screen, and refresh only when it is safe. Never interrupt typing. */
  onRemote(remote){
    if(!S||!S.signed) return;
    const before=serialize(S),wasReset=(remote.resetAt||0)>(S.resetAt||0);
    S=mergeState(S,remote);
    if(wasReset){ V={};NAV=[];LAST=-1;render();return; }
    if(serialize(S)===before) return;
    const el=document.activeElement, typing=el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA');
    if(!typing){ LAST=-1;render(); }
  }
};
/* Show a connecting state until Firebase resolves the auth state.
   If Firebase never initialises, fall back to the sign in screen after 6s. */
S=fresh();
window.__brigAuthPending=true;
render();
setTimeout(function(){ if(window.__brigAuthPending){ window.__brigAuthPending=false; render(); } },6000);
try{ history.replaceState(null,''); history.pushState(null,''); }catch(e){}
window.addEventListener('popstate',function(){
  back();
  try{ history.pushState(null,''); }catch(e){}
});
</script>
<script type="module">
/* Firebase auth and storage layer.
   If these imports 404, bump the version number in all three URLs to the
   current Firebase JS SDK version shown in the Firebase docs. */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup,
         signInWithEmailAndPassword, createUserWithEmailAndPassword,
         signOut, deleteUser, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAh70QZBMIycuK1hMkKD9mp7S7ubiPJF4A",
  authDomain: "brigvanti-academy.firebaseapp.com",
  projectId: "brigvanti-academy",
  storageBucket: "brigvanti-academy.firebasestorage.app",
  messagingSenderId: "951390386116",
  appId: "1:951390386116:web:c1ec0d8b0fced5212d1691"
};
/* Analytics is deliberately omitted. It stays behind the consent gate. */

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
/* Reset emails and the Google sign-in window follow the app language. */
auth.languageCode=window.BRIG_LANG==='nl'?'nl':'en';
/* Connect to the named database "brigvanti". Without the third argument the
   SDK talks to the "(default)" database, which is not where this project's
   data lives, so reads and writes failed with "unavailable" and nothing was
   stored. Long-polling stays on as a network compatibility safeguard. */
const db=initializeFirestore(app,{ experimentalForceLongPolling:true },'brigvanti');

let uid=null;
function cacheKey(key){ return key+':'+(uid||'anon'); }

/* Storage seam. One document per user at /users/{uid}. The whole state is
   held as a single JSON string field, which avoids Firestore key and nesting
   limits. A local copy is kept for offline use and cleared on sign out. */
window.storage={
  /* Instant read from the device copy. No network, so login never waits on
     the server. */
  getLocal(key){
    let local=null;
    try{ local=localStorage.getItem(cacheKey(key)); }catch(e){}
    return local!=null?{ value:local }:null;
  },
  /* Pull the server copy, merge it with this device, and hand the union back
     so the caller can adopt it and re-render. Also heals the server when this
     device holds progress the server lacks. Returns null when there is nothing
     to add or the server is unreachable. Runs in the background. */
  async syncFromServer(key){
    if(!uid) return null;
    startSnapshot();
    let local=null;
    try{ local=localStorage.getItem(cacheKey(key)); }catch(e){}
    const M=window.brigMerge, lobj=M?M.parseBlob(local):null;
    try{
      const snap=await getDoc(doc(db,'users',uid));
      const sobj=(snap.exists()&&typeof snap.data().blob==='string')?M.parseBlob(snap.data().blob):null;
      const merged=M.mergeState(lobj,sobj);
      if(!merged) return null;
      const s=JSON.stringify(merged);
      try{ localStorage.setItem(cacheKey(key),s); }catch(e){}
      if(lobj) setDoc(doc(db,'users',uid),{ blob:s, updated:Date.now() }).catch(function(e){ console.warn('[brigvanti sync] heal write failed:', (e&&e.code)||e); });
      return merged;
    }catch(e){
      console.warn('[brigvanti sync] server read failed:', (e&&e.code)||e);
      return null;
    }
  },
  async set(key,value){
    try{ localStorage.setItem(cacheKey(key),value); }catch(e){}
    if(!uid) return value;
    const M=window.brigMerge, lobj=M?M.parseBlob(value):null;
    let merged=lobj;
    try{
      /* Merge with the current server copy, then write the union. This keeps a
         write from the other device from being clobbered by ours. */
      const snap=await getDoc(doc(db,'users',uid));
      const sobj=(snap.exists()&&typeof snap.data().blob==='string')?M.parseBlob(snap.data().blob):null;
      merged=M.mergeState(lobj,sobj)||lobj;
      const s=JSON.stringify(merged);
      await setDoc(doc(db,'users',uid),{ blob:s, updated:Date.now() });
      try{ localStorage.setItem(cacheKey(key),s); }catch(e){}
      return s;
    }catch(e){
      /* The device copy is already saved above, so nothing is lost. The error
         code tells us why the server write failed. permission-denied points at
         the security rules, unavailable at the connection or database. */
      console.warn('[brigvanti sync] server write failed:', (e&&e.code)||e);
      return JSON.stringify(merged);
    }
  },
  async replace(key,value){
    if(!uid) throw new Error('no-user');
    await setDoc(doc(db,'users',uid),{ blob:value, updated:Date.now() });
    try{ localStorage.setItem(cacheKey(key),value); }catch(e){}
  },
  async delete(key){
    stopSnapshot();
    try{ localStorage.removeItem(cacheKey(key)); }catch(e){}
    if(!uid) return;
    try{ await deleteDoc(doc(db,'users',uid)); }catch(e){}
  },
  clearLocal(key){ try{ localStorage.removeItem(cacheKey(key)); }catch(e){} }
};

/* Live cross-device updates. While two devices are open at once, a change on
   one merges into the other within a second. The listener never moves the
   screen and never interrupts typing. */
let snapOff=null;
function startSnapshot(){
  if(snapOff||!uid) return;
  const ref=doc(db,'users',uid);
  snapOff=onSnapshot(ref,function(snap){
    if(!snap.exists()) return;
    const d=snap.data();
    if(typeof d.blob!=='string') return;
    const M=window.brigMerge, remote=M?M.parseBlob(d.blob):null;
    if(!remote) return;
    try{ localStorage.setItem(cacheKey('brigvanti_pilot_v2'),d.blob); }catch(e){}
    if(window.brigvantiApp&&window.brigvantiApp.onRemote) window.brigvantiApp.onRemote(remote);
  },function(){});
}
function stopSnapshot(){ if(snapOff){ try{snapOff();}catch(e){} snapOff=null; } }

window.brigvantiAuth={
  async google(){ await signInWithPopup(auth,new GoogleAuthProvider()); },
  async signInEmail(email,pw){ await signInWithEmailAndPassword(auth,email,pw); },
  async registerEmail(email,pw){ await createUserWithEmailAndPassword(auth,email,pw); },
  async doSignOut(){ await signOut(auth); },
  async token(){ return auth.currentUser?await auth.currentUser.getIdToken():null; },
  msg(e){
    const c=(e&&e.code)||'';
    if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found') return 'Email or password is not correct.';
    if(c==='auth/email-already-in-use') return 'That email already has an account. Switch to Sign in.';
    if(c==='auth/weak-password') return 'Choose a password of at least six characters.';
    if(c==='auth/invalid-email') return 'Enter a valid email address.';
    if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request') return 'Sign in was cancelled.';
    if(c==='auth/network-request-failed') return 'No connection. Check your network and try again.';
    if(c==='auth/requires-recent-login') return 'Please sign in again, then retry deleting your account.';
    return 'Sign in failed. Please try again.';
  }
};

/* Reminder records. The account record merges, so the server's own fields
   (lastSentAt, unanswered, sentLog) are never overwritten by the browser.
   The last written schedule is remembered per user, so unchanged saves cost nothing. */
window.brigReminders={
  async listDevices(){
    if(!uid) return [];
    const s=await getDocs(collection(db,'reminders',uid,'devices'));
    return s.docs.map(function(d){ return Object.assign({ id:d.id },d.data()); });
  },
  async setDevice(id,data){ if(uid) await setDoc(doc(db,'reminders',uid,'devices',id),data); },
  async deleteDevice(id){ if(uid) await deleteDoc(doc(db,'reminders',uid,'devices',id)); },
  async saveSchedule(fields,force){
    if(!uid) return;
    const k='brigvanti_rsig:'+uid, sig=JSON.stringify(fields);
    let old=null; try{ old=localStorage.getItem(k); }catch(e){}
    if(!force&&old===sig) return;
    await setDoc(doc(db,'reminders',uid),fields,{ merge:true });
    try{ localStorage.setItem(k,sig); }catch(e){}
  },
  async deleteAll(){
    if(!uid) return;
    const s=await getDocs(collection(db,'reminders',uid,'devices'));
    await Promise.all(s.docs.map(function(d){ return deleteDoc(d.ref); }));
    await deleteDoc(doc(db,'reminders',uid));
    try{ localStorage.removeItem('brigvanti_rsig:'+uid); }catch(e){}
  }
};

/* Server-side deletion. Delete the user document first, then the auth account.
   deleteUser can throw auth/requires-recent-login, which the app surfaces. */
window.brigvantiDeleteAccount=async function(){
  if(uid){
    /* The hourly reminder job also removes records of deleted accounts, so a
       failure here never leaves reminders running. */
    try{ await window.brigReminders.deleteAll(); }catch(e){ console.warn('[brigvanti reminders] delete failed:',(e&&e.code)||e); }
    await deleteDoc(doc(db,'users',uid));
  }
  const u=auth.currentUser;
  if(u) await deleteUser(u);
};
window.brigvantiSendReset=async function(){
  const u=auth.currentUser;
  if(u&&u.email) await sendPasswordResetEmail(auth,u.email);
};

onAuthStateChanged(auth,async function(user){
  window.__brigAuthPending=false;
  if(user){
    uid=user.uid;
    if(window.brigvantiApp) await window.brigvantiApp.onSignedIn(user);
  }else{
    stopSnapshot();
    uid=null;
    if(window.brigvantiApp) window.brigvantiApp.onSignedOut();
  }
});
</script>
