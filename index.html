-c","c":"D4.3","l":2,"f":"c","cl":"I treat isolated claims from unverified platforms with appropriate skepticism until they are validated.","s":"If an unverified piece of news appears exclusively on a single unknown blog, how should its credibility be assessed?","o":["Treating the narrative immediately as an established, proven fact.","Accepting it as highly probable simply because the text reads clearly.","Archiving the entry without executing any further validation steps.","Weak until a trustworthy source corroborates it"],"k":3,"w":"A lone unknown source is weak until corroborated."},{"i":"D4.3-L3-a","c":"D4.3","l":3,"f":"a","cl":"I identify visual anomalies that suggest an image may be artificially generated or digitally altered.","s":"A viral image shows subtle rendering errors around a subject's hands and distorted text on a background sign; what is the correct analytical judgment?","o":[" Sharing the asset across social channels immediately to boost visibility.","It may be AI-generated or edited; verify before believing it","Concluding definitively that the file is an unaltered, authentic photograph."," Operating under the assumption that digital media assets can never be falsified."],"k":1,"w":"Tell-tale artefacts suggest verifying provenance."},{"i":"D4.3-L3-b","c":"D4.3","l":3,"f":"b","cl":"I can suspect AI-mass-produced content.","s":"An 'article' reads generic, has no author, and its facts are vague. Reasonable suspicion?","o":["It could be AI-mass-produced content; check its provenance","No content is ever AI-made.","It is clearly a top expert source.","Trust it because it is long."],"k":0,"w":"Generic, unattributed content warrants a provenance check."},{"i":"D4.3-L3-c","c":"D4.3","l":3,"f":"c","cl":"I judge a modern source by provenance and corroboration.","s":"Strongest way to judge a modern source's reliability?","o":["Its provenance, author accountability and corroboration","Its overall length.","Its font and layout.","Whether it agrees with you."],"k":0,"w":"Provenance, accountability and corroboration are the substance."},{"i":"D4.3-L4-a","c":"D4.3","l":4,"f":"a","cl":"I can give others a simple source-check rule.","s":"You teach a friend to vet online claims. Best short rule?","o":["'Check who said it, when, and whether trusted sources agree.'","'Trust the most dramatic claim.'","'Longer means truer.'","'Believe the first result.'"],"k":0,"w":"A who/when/corroboration rule is simple and effective."},{"i":"D4.3-L4-b","c":"D4.3","l":4,"f":"b","cl":"I pass on a habit for the AI-content era.","s":"Best habit to pass on now that AI can mass-produce content?","o":["Pause on striking content and confirm its origin before sharing","Never question anything at all.","Share first and check never.","Assume everything shared is human and true."],"k":0,"w":"Pausing to confirm origin counters AI-era misinformation."},{"i":"D4.3-L4-c","c":"D4.3","l":4,"f":"c","cl":"I establish practical verification guidelines for teams to stop the spread of unverified information.","s":" If a collaborative group continuously circulates unverified claims, what is the most constructive intervention?","o":["Maintaining complete silence and allowing the pattern to persist.","Actively contributing additional unverified narratives to the discussion.","Publicly mocking individual participants for sharing the material.","Introduce a quick check-before-share step with clear criteria"],"k":3,"w":"A shared check-before-share norm addresses the root."},{"i":"D4.4-L1-a","c":"D4.4","l":1,"f":"a","cl":" I organize file directories systematically to ensure seamless retrieval for future use.","s":"If you anticipate needing a specific document a month from now, which action ensures it remains accessible?","o":["Relying strictly on your mental retention to remember the file contents.","Leaving the asset unindexed within a cluttered, unorganized download directory.","Deleting the record immediately under the assumption that it keeps the workspace tidy.","Save it with a clear name in a sensible folder"],"k":3,"w":"Clear naming and folder placement make it findable."},{"i":"D4.4-L1-b","c":"D4.4","l":1,"f":"b","cl":"I mitigate data loss risks by maintaining secure duplicates of all critical media files.","s":"If you currently possess only a single copy of high-value photographs, which strategy represents a responsible approach?","o":["Keep a backup copy somewhere safe","Printing physical copies of the images and permanently erasing the digital originals.","Purging the source files globally to optimize local hardware storage capacity.","Operating under the optimistic assumption that the storage device will never experience a hardware failure."],"k":0,"w":"A backup protects against device loss or failure."},{"i":"D4.4-L1-c","c":"D4.4","l":1,"f":"c","cl":"I evaluate privacy requirements before disclosing sensitive credentials or personal details.","s":"If an intake questionnaire requests more personal data points than the immediate objective requires, what is the safest response?","o":["Give only what the task actually needs","Providing superfluous personal records to ensure the recipient has extra details.","Filling out every optional data entry point completely under the assumption that all forms demand total completion.","Broadcasting those personal credentials publicly across open communication platforms."],"k":0,"w":"Share only what is necessary for the task."},{"i":"D4.4-L2-a","c":"D4.4","l":2,"f":"a","cl":"I streamline chaotic data systems by applying a straightforward, logical organizational hierarchy.","s":"When confronted with a disorganized and chaotic file directory, which approach establishes the most effective order?","o":["A simple structure by topic or date","Maintaining absolute disorder across the local environment.","Consolidating every individual file into a singular, unindexed folder.","Assigning completely randomized characters to every file name."],"k":0,"w":"A simple topic or date structure keeps data manageable."},{"i":"D4.4-L2-b","c":"D4.4","l":2,"f":"b","cl":"I implement clear version control methods to track document revisions and protect historical data.","s":"Which practice demonstrates a responsible habit for managing multiple iterations of a critical document?","o":["Refusing to save any incremental revisions or drafts during the drafting process.","Maintaining dozens of near-identical, unlabeled file duplicates across the system.","Blindly overwriting active data layers and permanently erasing previous modification histories.","Keep clear version names or use version history"],"k":3,"w":"Versioning preserves history without clutter."},{"i":"D4.4-L2-c","c":"D4.4","l":2,"f":"c","cl":"I enforce strict data access controls to restrict sensitive contact spreadsheets to authorized personnel only.","s":"When managing a master ledger containing confidential personal contact information, which practice ensures compliance with privacy standards?","o":["Keep it organised and limited to those who need it","Distributing the entire spreadsheet globally via email to your complete network.","Publishing the unfiltered database to a public directory for general convenience.","Storing the asset within an open-access cloud environment with zero security permissions."],"k":0,"w":"Limit access to personal data to those who need it."},{"i":"D4.4-L3-a","c":"D4.4","l":3,"f":"a","cl":"I practice secure data minimization by permanently purging sensitive personal records that are no longer necessary.","s":"If you possess legacy archives containing other individuals' personal identifiers that are no longer operationally useful, what action should you take?","o":["Delete or archive what you no longer need, especially personal data","Retaining all personal records indefinitely within local servers by default.","Disseminating the stale data packages to an open public forum.","Monetizing the legacy information by selling the records to external brokers."],"k":0,"w":"Removing unneeded D5.1-L1-a","c":"D5.1","l":1,"f":"a","cl":"I can recognise a repetitive task worth automating.","s":"Which is a good candidate for automation in daily life?","o":["A one-off, unique decision you make once.","A spontaneous, personal chat with a friend.","Choosing a meaningful birthday gift for someone.","Copying the same weekly grocery list every week"],"k":3,"w":"A repeated, identical task is the automation candidate."},{"i":"D5.1-L1-b","c":"D5.1","l":1,"f":"b","cl":"I recognize the signs of an automatable task.","s":"Which sign suggests a task is worth automating?","o":["You do it exactly once and never again.","You frequently repeat the same steps.","It needs fresh personal judgement every time.","Its outcome changes completely each time."],"k":1,"w":"Frequent repetition of the same steps signals automatability."},{"i":"D5.1-L1-c","c":"D5.1","l":1,"f":"c","cl":"I can easily distinguish between a rule-based task and one that requires human judgment.","s":"Which task is most rule-like and repetitive?","o":["Categorizing customer support emails by urgency.","Reviewing weekly expense reports for budget compliance.","Updating the employee directory with new hires' contact details.","Renaming photos by date every month"],"k":3,"w":"A regular, rule-based chore fits automation; the others need human judgement."},{"i":"D5.1-L2-a","c":"D5.1","l":2,"f":"a","cl":"I prioritize automation based on the actual time it saves.","s":"One repetitive task saves 2 hours a week; another saves 10 seconds a year. Which to automate first?","o":["Automate neither of them.","The 2-hours-a-week task","Just pick one at random.","The one saving ten seconds a year."],"k":1,"w":"Prioritise by real time saved."},{"i":"D5.1-L2-b","c":"D5.1","l":2,"f":"b","cl":"I know exactly what makes a task a good candidate for automation.","s":"The best automation candidate is usually?","o":["Frequent, rule-based, and low-risk if slightly wrong","One that is emotional and unique each time.","One that is rare and needs deep judgement.","One that is one-off and high-stakes."],"k":0,"w":"Frequent, rule-based, low-risk work is ideal to automate."},{"i":"D5.1-L2-c","c":"D5.1","l":2,"f":"c","cl":"I automate the repetitive elements and preserve the human judgment call.","s":"What is the best approach for a frequent task that demands a human judgment call every time?","o":["Hide the AI's decision so no one questions it.","Automate routine processes and preserve human judgment.","Fully automate the entire process, including the decision-making step.","Do not automate any aspect of it."],"k":1,"w":"Automate the routine, keep the judgement human."},{"i":"D5.1-L3-a","c":"D5.1","l":3,"f":"a","cl":"I redesign a routine so AI does the grind and I review.","s":"You spend evenings sorting receipts by hand. Best redesign?","o":["Stop tracking your money altogether.","Let AI extract and categorise, while you review the summary","Keep doing it all by hand.","Automate paying them too, entirely unchecked."],"k":1,"w":"AI does the sorting, you keep the review."},{"i":"D5.1-L3-b","c":"D5.1","l":3,"f":"b","cl":"I implement draft-and-approval processes instead of sending unverified outputs.","s":"Redesigning a weekly report you write. What is the best approach?","o":["Have AI draft from your data, then use a second AI tool to automatically review and send it.","Draft the report by hand from your data, then have AI edit and finalize it for sending.","Have AI draft from your data, then you edit and approve","Have AI generate multiple drafts from your data, then choose the best draft to send without making edits."],"k":2,"w":"AI drafts, you approve."},{"i":"D5.1-L3-c","c":"D5.1","l":3,"f":"c","cl":"I keep human checkpoints where they matter most.","s":"A good AI-assisted routine keeps what in place?","o":[" Every step completely isolated within a silo","A human check at the points that matter","A continuous automated loop without human oversight.","An identical review gate at every single micro-task."],"k":1,"w":"Keep a human checkpoint at the points that matter."},{"i":"D5.1-L4-a","c":"D5.1","l":4,"f":"a","cl":"I build automated workflows with built-in checks and human fallback paths.","s":"When automating an onboarding flow end-to-end, which choice ensures the highest resilience?","o":["Deploying a fully hands-off, closed-loop automation cycle across all variables.","Relying entirely on the AI engine to handle edge cases and data validation anomalies internally.","Implementing an optimistic execution model that processes all inputs uniformly and logs errors silently.","Automate the steps but add checks and a human fallback for exceptions"],"k":3,"w":"Checks plus a human fallback make process automation safe."},{"i":"D5.1-L4-b","c":"D5.1","l":4,"f":"b","cl":"I prioritise reliability and clear ownership.","s":"Designing automation others depend on. What are the key principles?","o":["Reliability, clear ownership, and a way to catch failures","Maximizing execution velocity while leaving error management to the end users.","Operating an independent system without logging or state tracking to save on cloud costs.","Decentralizing the architecture completely so that no single team is responsible for failures."],"k":0,"w":"Reliability, ownership and failure-catching come first."},{"i":"D5.1-L4-c","c":"D5.1","l":4,"f":"c","cl":"I make silent failures visible.","s":"An automated group process sometimes fails silently. Best design fix?","o":["Optimizing execution speed so the process finishes before an error can cascade.","Relying on an optimistic execution model that assumes the system will self-correct over time.","Suppressing non-critical error logs to keep the diagnostic dashboard clean and un-cluttered.","Add alerts and a fallback so failures are caught and handled"],"k":3,"w":"Alerts and a fallback surface and handle silent failures."},{"i":"D5.2-L2-a","c":"D5.2","l":2,"f":"a","cl":"I can identify low-risk, high-utility use cases suitable for initial automation efforts.","s":"Which scenario represents the safest and most reliable point of entry for personal automation?","o":["Outsourcing primary parenting decisions and child-rearing choices to an algorithmic model.","Deploying automated text templates to generate apologies to personal acquaintances.","Allowing an unmonitored script to execute high-value financial investments autonomously.","Configuring an automated reminder system for recurring billing cycles."],"k":3,"w":"A low-stakes recurring reminder is a safe first automation."},{"i":"D5.2-L2-b","c":"D5.2","l":2,"f":"b","cl":"I identify repetitive communication tasks and streamline them using standardized templates.","s":" If you routinely compose and dispatch the identical email message on a weekly basis, which approach represents the simplest automation entry point?","o":["Terminating the communication stream entirely regardless of its operational necessity."," Saving a template or using a saved reply","Continuing to draft the entire message manually from scratch during each cycle.","Retaining external administrative personnel solely to manage the manual transcription."],"k":1,"w":"A saved template removes the repetition."},{"i":"D5.2-L2-c","c":"D5.2","l":2,"f":"c","cl":"I identify repetitive file management tasks and streamline them using simple automated workflows.","s":"When managing a large volume of digital imagery, which strategy represents a practical entry point for small-scale automation?","o":["Leaving the entire repository unorganized and unindexed indefinitely.","Purging the entire file collection globally to eliminate storage footprint.","Utilizing a rule or dedicated tool to sort files automatically by date.","Manually renaming several thousand assets individually on a recurring basis."],"k":2,"w":"An auto-sort rule handles the repetitive sorting."},{"i":"D5.2-L3-a","c":"D5.2","l":3,"f":"a","cl":" I design automated workflows to process standard scenarios seamlessly while flagging anomalies for manual review.","s":"How should a robust, multi-step automation workflow be structured to manage operational risks?","o":["Handle the common cases and flag the rest for you","Operate without an integrated error-handling framework or exception path.","Terminate execution silently without generating an alert when encountering unexpected inputs.","Maintain a fixed execution path that assumes all incoming data payloads are flawless.."],"k":0,"w":"Handle the common path and flag exceptions."},{"i":"D5.2-L3-b","c":"D5.2","l":3,"f":"b","cl":"I enforce a mandatory review checkpoint before any automated outputs are finalized and distributed.","s":"If you construct a multi-step automation that gathers data, summarizes it, and drafts a message, which safeguard ensures output quality?","o":["Broadcasting the generated correspondence to arbitrary external recipients.","Omitting the synthesis phase completely to speed up the processing pipeline.","Allowing the distribution mechanism to dispatch the unverified draft immediately.","Review the summary before the email goes out"],"k":3,"w":"A review before send guards the output."},{"i":"D5.2-L3-c","c":"D5.2","l":3,"f":"c","cl":"I identify the operational factors that allow automated workflows to deliver genuine time savings.","s":"Which design characteristic ensures that a multi-step automation truly optimizes productivity and saves time?","o":[" It completely obfuscates its execution history and processing steps from logs.","It reliably handles the routine flow with minimal fixing","It experiences frequent execution exceptions and runtime failures during standard operation.","It demands continuous manual calibration and troubleshooting during every processing cycle."],"k":1,"w":"Reliable handling with little fixing is where the saving is."},{"i":"D5.2-L4-a","c":"D5.2","l":4,"f":"a","cl":"I proactively test edge cases and integrate robust error-handling mechanisms into my automations.","s":"When designing an automated workflow that other team members depend on, which practice best ensures system resilience?","o":["Test edge cases and add clear failure handling","Deploy the script immediately and rely entirely on optimistic execution.","Construct the logic without an exception recovery path or rollback protocol.","Bypass verification phases altogether to accelerate the deployment schedule."],"k":0,"w":"Testing edge cases and handling failures make it dependable."},{"i":"D5.2-L4-b","c":"D5.2","l":4,"f":"b","cl":"I design automated workflows to process malformed inputs safely and generate proactive failure notifications.","s":"Which characteristic distinguishes a resilient and dependable automation from a fragile system architecture?","o":["It operates without internal logging mechanisms or telemetry tracking.","It features zero administrative support paths for maintenance or recovery operations.","It requires pristine data formatting and fails immediately when encountering deviations.","It handles bad input gracefully and alerts on failure"],"k":3,"w":"Graceful handling of bad input plus alerts is dependability."},{"i":"D5.2-L4-c","c":"D5.2","l":4,"f":"c","cl":"I ensure all shared automations are deployed alongside comprehensive documentation and a designated owner.","s":"To guarantee long-term dependability, what components must accompany a shared automated workflow?","o":["Zero technical contact endpoints or administrative pathways if the system crashes.","Clear docs and a named owner for when it breaks","Complete omission of operational documentation or usage instructions.","Intentionally obscured backend logic that remains hidden from internal audit."],"k":1,"w":"Docs and an owner keep a shared automation maintainable."},{"i":"D5.3-L3-a","c":"D5.3","l":3,"f":"a","cl":"I configure custom assistants with a clearly defined operational scope and authoritative reference materials.","s":"When building a custom assistant to address frequently asked questions for a side project, which configuration choice is most critical?","o":["Leaving the model entirely unprompted without behavioral boundaries or scope."," Enabling unrestricted creative generation so it fabricates missing facts autonomously.","Deploying the model directly to production environments without initial validation.","Clear instructions and the reference info it should use"],"k":3,"w":"Clear scope and reference material make it useful and safe."},{"i":"D5.3-L3-b","c":"D5.3","l":3,"f":"b","cl":"I routinely refine custom assistants to ensure they remain strictly within their intended operational scope.","s":"If a custom assistant begins generating off-topic responses during interactions, which adjustment represents the most effective solution?","o":["Allowing the underlying model to speculate freely when encountering unfamiliar queries.","Purging the system prompt entirely to eliminate behavioral guardrails.","Tighten its instructions to stay on scope and defer otherwise","Maintaining the status quo without modifying the model's configuration parameters."],"k":2,"w":"Scoping instructions keep it on-task."},{"i":"D5.3-L3-c","c":"D5.3","l":3,"f":"c","cl":"I systematically validate custom assistants against real-world test cases before deploying them to others.","s":"Prior to distributing a newly configured custom assistant to your team or audience, which step ensures its operational readiness?","o":["Test it on real questions and fix weak answers","Circumvent the evaluation phase completely to accelerate the launch timeline.","Obfuscate the underlying logic and system prompts to hide its actual functions.","Assume the initial configuration is flawless and bypass performance verification."],"k":0,"w":"Testing on real questions catches weak spots first."},{"i":"D5.3-L4-a","c":"D5.3","l":4,"f":"a","cl":"I implement strict behavioral limits and comprehensive telemetry logging on any autonomous acting agent.","s":"When deploying an agent capable of executing consequential actions like sending communications or initiating purchases, which architectural choice provides the highest level of safety?An agent that can take actions like send or buy. Strongest safety design?","o":["Permitting immediate execution of all tasks without a verification gateway.","Granting absolute systemic autonomy with zero operational constraints.","Disabling transactional tracking to avoid maintaining an execution record.","Confirmation or limits on consequential actions, plus clear logging"],"k":3,"w":"Limits, confirmation and logging control an acting agent."},{"i":"D5.3-L4-b","c":"D5.3","l":4,"f":"b","cl":"I apply the principle of least privilege by granting an acting agent only the specific access required for its task.","s":"When connecting an autonomous agent to your external accounts, which configuration establishes the safest security boundary?","o":["Granting unrestricted administrative privileges across all platforms without scope definitions.","Grant only the access it needs, nothing more","Distributing your primary credentials and access tokens broadly across the environment.","Structuring the integration without a mechanism to revoke or terminate access permissions."],"k":1,"w":"Least-privilege access limits the blast radius."},{"i":"D5.3-L4-c","c":"D5.3","l":4,"f":"c","cl":" I integrate mandatory manual intervention overrides within all autonomous agent architectures.","s":"Which design pattern best ensures system safety when deploying an operational acting agent?","o":["Engineering the engine to execute backend modifications silently.","Restricting administrative access so the system cannot be manually overridden.","Provisioning absolute system privileges across all environment vectors.","A human override and limits on high-impact actions"],"k":3,"w":"Override plus impact limits are core safety."},{"i":"D5.4-L2-a","c":"D5.4","l":2,"f":"a","cl":"I review automated output before it goes public.","s":"Your automation drafts social posts. Sensible control?","o":["Never look at the posts at all.","Let it post to your bank too.","Review posts before they go public","Auto-post everything instantly."],"k":2,"w":"A review before publishing keeps you in control."},{"i":"D5.4-L2-b","c":"D5.4","l":2,"f":"b","cl":"I sanity-check an automated summary before acting.","s":"Automated summaries feed a decision. Human-in-control step?","o":["Read and sanity-check before deciding","Act on them entirely unread.","Ignore both summaries and the decision.","Delegate the whole decision to the tool."],"k":0,"w":"Sanity-checking before deciding keeps the human in charge."},{"i":"D5.4-L2-c","c":"D5.4","l":2,"f":"c","cl":"I recognise the sign a human is still in control.","s":"Best sign a human is still in control?","o":["A person approves consequential outputs","The tool decides and acts entirely alone.","The tool cannot be stopped.","No one reviews anything at all."],"k":0,"w":"Human approval of consequential output is the marker."},{"i":"D5.4-L3-a","c":"D5.4","l":3,"f":"a","cl":"I place the checkpoint before a consequential step.","s":"Where should a human checkpoint sit in an automation?","o":["Before any consequential or irreversible step","At some random point in the flow.","Nowhere in the flow at all.","Only after the harm is already done."],"k":0,"w":"Place the checkpoint before consequential steps."},{"i":"D5.4-L3-b","c":"D5.4","l":3,"f":"b","cl":"I put approval before money moves.","s":"Designing an approval step, best placement?","o":["Before the money is sent","Place it nowhere at all.","After the money has already been sent.","Only on the trivial steps."],"k":0,"w":"Approve before the irreversible action."},{"i":"D5.4-L3-c","c":"D5.4","l":3,"f":"c","cl":"I apply human-in-the-loop where it matters most.","s":"Human-in-the-loop is most valuable for?","o":["Purely cosmetic choices.","Zero-risk trivial steps.","Nothing at all.","High-impact or irreversible actions"],"k":3,"w":"It matters most for high-impact, irreversible actions."},{"i":"D5.4-L4-a","c":"D5.4","l":4,"f":"a","cl":"I build in action logs and an easy override.","s":"Strongest oversight feature for an automation others use?","o":["It has hidden behaviour.","It keeps no logs at all.","A clear log of actions plus an easy override or stop","It has no off switch."],"k":2,"w":"Action logs and an easy override give real oversight."},{"i":"D5.4-L4-b","c":"D5.4","l":4,"f":"b","cl":"I know why logging matters.","s":"Why build logging into an automation?","o":["To hide its errors from view.","So you can see what it did and catch or undo problems","There is no real reason to.","To deliberately slow it down."],"k":1,"w":"Logs make behaviour visible and problems recoverable."},{"i":"D5.4-L4-c","c":"D5.4","l":4,"f":"c","cl":"I make the override easy to reach.","s":"An override control should be?","o":["Easy to find and use when something goes wrong","Disabled by default forever.","Kept secret from users.","Impossible to reach when needed."],"k":0,"w":"An override must be reachable when needed."},{"i":"D6.1-L1-a","c":"D6.1","l":1,"f":"a","cl":"I do not paste others' personal data into public AI tools.","s":"You want AI to summarise a document full of clients' personal details. Safe move?","o":["Remove or anonymise the personal details first, or use an approved tool","Paste it all into a public tool as it is.","Add even more personal data for context.","Post the document publicly to get help."],"k":0,"w":"Strip or anonymise personal data, or use a sanctioned tool."},{"i":"D6.1-L1-b","c":"D6.1","l":1,"f":"b","cl":"I can tell which data is risky to paste.","s":"Which is riskiest to paste into a public AI tool?","o":["A generic recipe you found.","Someone's name, address and ID number","A simple maths question.","A public news headline."],"k":1,"w":"Identifying personal data is the sensitive category."},{"i":"D6.1-L1-c","c":"D6.1","l":1,"f":"c","cl":"I check what I am pasting before I paste it.","s":"Best habit before pasting text into an AI tool?","o":["Never look at what is in it.","Add your passwords so it has full context.","Check it does not contain other people's private data","Include your bank details to be thorough."],"k":2,"w":"Scan for others' private data before pasting."},{"i":"D6.1-L2-a","c":"D6.1","l":2,"f":"a","cl":"I share only the minimum data the task needs.","s":"AI can help draft a letter about a dispute. Data-minimising approach?","o":["Paste the full case file with every name.","Add unrelated personal history for colour.","Include everyone's contact details too.","Share only the details needed, generalising names where possible"],"k":3,"w":"Give only what the task needs."},{"i":"D6.1-L2-b","c":"D6.1","l":2,"f":"b","cl":"I know what data minimisation means.","s":"Data minimisation means?","o":["Never use AI at all.","Share everything, just in case.","Always collect more than you need.","Give only what is necessary for the task"],"k":3,"w":"Minimisation is giving only what is necessary."},{"i":"D6.1-L2-c","c":"D6.1","l":2,"f":"c","cl":"I strip identifying detail from a snippet.","s":"You want AI to check one paragraph's grammar. Sensible input?","o":["Attach all of your client files.","The paragraph plus your passwords.","Just the paragraph, with identifying details removed","The whole confidential report."],"k":2,"w":"Send only the relevant, de-identified snippet."},{"i":"D6.1-L3-a","c":"D6.1","l":3,"f":"a","cl":"I check for a lawful basis before a big new data use.","s":"You plan to process many people's personal data in a new AI way. Sound step?","o":["Assume the rules never apply to you.","Check you have a lawful basis and whether a privacy assessment is needed","Just do it, with no thought.","Hide the processing from everyone."],"k":1,"w":"Confirm lawful basis and assess whether a privacy check is required."},{"i":"D6.1-L3-b","c":"D6.1","l":3,"f":"b","cl":"I know which use likely needs a privacy impact check.","s":"Which use most likely needs a privacy impact check?","o":["Rewriting your own personal note.","Summarising a public article.","Systematically profiling many people's sensitive data","A grammar fix on public text."],"k":2,"w":"Large-scale sensitive profiling is a classic trigger."},{"i":"D6.1-L3-c","c":"D6.1","l":3,"f":"c","cl":"I treat special-category data with extra care.","s":"Handling special-category data such as health or beliefs with AI, right instinct?","o":["Treat it like any other data.","Share it freely to be helpful.","Apply extra care; it needs stronger justification and safeguards","Ignore any rules around it."],"k":2,"w":"Special-category data warrants heightened protection."},{"i":"D6.1-L4-a","c":"D6.1","l":4,"f":"a","cl":"I design privacy protections in from the start.","s":"Setting up an AI process for a group that touches personal data. Privacy-by-design choice?","o":["Decide privacy later, if ever.","Collect the minimum, limit access, and set retention from the start","Set no access controls at all.","Collect everything and keep it forever."],"k":1,"w":"Minimise, restrict access and set retention up front."},{"i":"D6.1-L4-b","c":"D6.1","l":4,"f":"b","cl":"I know what privacy-by-design means.","s":"Privacy-by-design means privacy is?","o":["Always someone else's problem.","An afterthought once something breaks.","Ignored entirely.","Built into the design from the beginning"],"k":3,"w":"It is designed in from the outset."},{"i":"D6.1-L4-c","c":"D6.1","l":4,"f":"c","cl":"I set safe defaults for personal data.","s":"Strongest default for a new AI workflow handling personal data?","o":["No documentation at all.","Keep the data indefinitely with no review.","Maximum data, wide-open access.","Minimal data, least access, clear retention"],"k":3,"w":"Minimal data and least access are safe defaults."},{"i":"D6.2-L1-a","c":"D6.2","l":1,"f":"a","cl":"I know AI is not automatically neutral.","s":"Which statement is accurate?","o":["Bias is impossible in software.","AI can reflect biases in its training data","AI is always perfectly neutral.","AI has no data behind it."],"k":1,"w":"Models can inherit bias from their data."},{"i":"D6.2-L1-b","c":"D6.2","l":1,"f":"b","cl":"I can name a likely cause of unfair output.","s":"An AI screening tool favours one group unfairly. Likely cause?","o":["Computers cannot be unfair.","It is purely random luck.","Bias learned from skewed past data","It is simply being objective."],"k":2,"w":"Skewed training data is a common source of unfairness."},{"i":"D6.2-L1-c","c":"D6.2","l":1,"f":"c","cl":"I keep a healthy awareness that outputs can be unfair.","s":"Healthy awareness about AI fairness?","o":["Stay alert that outputs can be unfair to some groups","AI cannot affect real people.","Fairness never really matters.","Assume its outputs are always fair."],"k":0,"w":"Remaining alert to potential unfairness is the aware stance."},{"i":"D6.2-L2-a","c":"D6.2","l":2,"f":"a","cl":"I can spot where AI bias would cause real harm.","s":"Where does AI bias matter most?","o":["Suggesting a film to watch.","Screening loan or job applicants","Recommending a playlist.","Picking a phone wallpaper."],"k":1,"w":"Bias in consequential gatekeeping causes real harm."},{"i":"D6.2-L2-b","c":"D6.2","l":2,"f":"b","cl":"I know which use needs the most fairness care.","s":"Which use needs the most fairness care?","o":["Suggesting a recipe.","Drafting a fun poem.","Naming a pet.","Deciding who gets access to a benefit"],"k":3,"w":"Access-to-resources decisions need fairness care."},{"i":"D6.2-L2-c","c":"D6.2","l":2,"f":"c","cl":"I raise a fairness concern when a tool ranks people.","s":"A tool ranks people for an opportunity. Responsible concern?","o":["Only its colour scheme.","None, since tools are neutral.","Check it is not systematically disadvantaging a group","Only its speed."],"k":2,"w":"Watch for systematic disadvantage to any group."},{"i":"D6.2-L3-a","c":"D6.2","l":3,"f":"a","cl":"I check outputs across groups and keep a human review.","s":"You use AI to shortlist volunteers. Sound fairness practice?","o":["Review whether it treats groups consistently, and keep human review","Assume the ranking is fair because it is automated.","Never review it at all.","Automate the final choice unchecked."],"k":0,"w":"Check consistency across groups and keep human review."},{"i":"D6.2-L3-b","c":"D6.2","l":3,"f":"b","cl":"I know how to detect bias in decisions.","s":"How might you detect bias in a tool's decisions?","o":["Look at its loading time.","Compare outcomes across different groups for unfair gaps","Check the tool's logo.","Assume there is none."],"k":1,"w":"Comparing outcomes across groups surfaces bias."},{"i":"D6.2-L3-c","c":"D6.2","l":3,"f":"c","cl":"I keep human review where fairness is at stake.","s":"For an impactful AI-assisted decision, keep?","o":["Only the fastest path.","No human involvement at all.","Human review, especially where fairness is at stake","No record of it kept."],"k":2,"w":"Keep human review where fairness matters."},{"i":"D6.2-L4-a","c":"D6.2","l":4,"f":"a","cl":"I design a routine bias check into a process.","s":"Strongest bias-check to build into a group's AI decision process?","o":["Hide the outcomes from view.","No checks at all.","Routinely compare outcomes across groups and act on unfair gaps","Trust the system by default."],"k":2,"w":"Routine cross-group comparison with action is a real check."},{"i":"D6.2-L4-b","c":"D6.2","l":4,"f":"b","cl":"I know what a good bias check needs.","s":"A good bias check needs?","o":["Secrecy around the results.","A quick glance and a hopeful assumption.","No data on who is affected.","Outcome data by group and a threshold for concern"],"k":3,"w":"Group outcome data and a concern threshold make it work."},{"i":"D6.2-L4-c","c":"D6.2","l":4,"f":"c","cl":"I act on a flagged unfair gap.","s":"If a bias check flags an unfair gap, best response?","o":["Hide the finding.","Simply ignore it.","Investigate and adjust the process or add human review","Just speed things up instead."],"k":2,"w":"Investigate and correct the process."},{"i":"D6.3-L1-a","c":"D6.3","l":1,"f":"a","cl":"I maintain absolute human accountability and final decision-making authority for high-stakes outcomes.","s":"When an AI recommends rejecting a sensitive request, what is the safest approach?","o":["Deferring the final determination indefinitely to avoid systemic bias.","Transferring ultimate liability and accountability entirely to the automated engine.","Permitting hands-off, autonomous execution of the system's recommendation to maximize processing efficiency","A human should make and own the final decision"],"k":3,"w":"A human decides and owns consequential outcomes."},{"i":"D6.3-L1-b","c":"D6.3","l":1,"f":"b","cl":"I maintain absolute clarity regarding human accountability for all automated outcomes","s":"When deploying an AI-assisted workflow, where does the ultimate legal and ethical accountability reside?","o":["Within the software engine's algorithmic processing framework.","With the hardware infrastructure utilized to execute the command.","The human who made or approved it","Distributed across the user base so that no individual party is responsible."],"k":2,"w":"Accountability rests with the human, not the tool."},{"i":"D6.3-L1-c","c":"D6.3","l":1,"f":"c","cl":"I treat AI as an advisory input, reserving final judgment for human decision-makers when individuals are affected.","s":"For an automated workflow that directly impacts an individual, how should the AI component be utilized?","o":["Positioned as an entirely opaque backend mechanism.","Implemented as an autonomous system with absolute execution authority.","An input to a human decision","Deployed as the solitary, hands-off decision-maker."],"k":2,"w":"AI informs, a human decides."},{"i":"D6.3-L2-a","c":"D6.3","l":2,"f":"a","cl":"I maintain active human intervention for high-impact determinations to prevent automated bias or error.","s":"When leveraging automated screening tools to evaluate candidate qualifications, which workflow model represents the most responsible deployment strategy?","o":[" Letting autonomous algorithmic scores execute final choices without appeal.","Enforcing total process opacity so metrics remain unreviewed.","Running silent back-end categorizations completely unmonitored.","Use the score as input; a person reviews and decides"],"k":3,"w":"Score as input, human decides."},{"i":"D6.3-L2-b","c":"D6.3","l":2,"f":"b","cl":"I clearly understand the operational principles of human-in-the-loop system architecture.","s":" In the context of critical and high-impact workflows, what does a human-in-the-loop framework require?","o":["A person checks and can change the outcome","Diffusing operational accountability so no individual party assumes responsibility.","Locking system outputs permanently so they cannot be manually overridden.","Allowing the automated system to execute actions immediately without review."],"k":0,"w":"A person can review and change the outcome."},{"i":"D6.3-L2-c","c":"D6.3","l":2,"f":"c","cl":"I carefully audit any high-stakes, AI-generated correspondence before final dissemination.","s":"If an automated system drafts an official decision regarding an individual's welfare or benefits, what action must occur prior to dispatch?","o":["Allowing the automated framework to publish the draft to a public directory.","Routing the unverified document directly to an automated delivery queue.","Executing immediate bulk distribution without manual oversight.","A person reviews and approves it"],"k":3,"w":"Human review before an impactful letter goes out."},{"i":"D6.3-L3-a","c":"D6.3","l":3,"f":"a","cl":" I identify high-impact automation use cases and route them through enhanced approval channels.","s":"Which category of automated decision-making requires additional administrative oversight or formal leadership sign-off?","o":["Selecting visual typography or design assets for a template.","Automating document naming conventions within local storage files.","Generating random personal dining recommendations for an informal team gathering.","Determining workforce compensation, shift allocations, or hiring selections."],"k":3,"w":"Pay, scheduling and hiring are high-impact."},{"i":"D6.3-L3-b","c":"D6.3","l":3,"f":"b","cl":" I understand the governance protocols required to manage high-impact automation use cases safely.","s":"Which approach ensures proper risk management when deploying a high-impact AI application?","o":["Deploying the system quietly without seeking formal administrative sign-off.","Suppressing operational logs to conceal the automation's involvement from stakeholders.","Establishing clear escalation paths and requiring formal human sign-off.","Allowing individual operators to execute outcomes autonomously without maintaining a central record."],"k":2,"w":"Escalation and sign-off fit high-impact uses."},{"i":"D6.3-L3-c","c":"D6.3","l":3,"f":"c","cl":" I understand the ethical and operational reasons for escalating high-impact automation use cases.","s":"Why is it critical to escalate high-impact AI applications to higher levels of oversight?","o":["To diffuse operational liability and dodge institutional accountability.","To intentionally delay the deployment timeline for bureaucratic amusement.","Because errors there seriously affect people","There is no logical or strategic justification for implementing escalation protocols."],"k":2,"w":"Serious human impact justifies escalation."},{"i":"D6.3-L4-a","c":"D6.3","l":4,"f":"a","cl":"I design comprehensive automation oversight by integrating clear ownership, routine reviews, and systematic record-keeping.","s":"When establishing a governance framework for a team's AI integration, which operational model provides the highest structural integrity?","o":["Defining clear ownership, reviewing impactful use cases, and maintaining formal records."," Disabling evaluation protocols entirely to eliminate administrative friction.","Enforcing total participant anonymity across all system interactions to bypass accountability.","Operating an ad-hoc system that explicitly avoids role definitions or activity logging."],"k":0,"w":"Ownership, review and records are the backbone."},{"i":"D6.3-L4-b","c":"D6.3","l":4,"f":"b","cl":" I clearly identify the foundational components that comprise effective AI governance frameworks.","s":" Which operational elements must be present to establish robust AI governance within a collaborative group?","o":["Eliminating structural accountability entirely to maximize operational agility.","Defining clear responsibilities and establishing escalation paths for high-impact use cases.","Suppressing all procedural documentation to minimize administrative overhead.","Maintaining absolute process secrecy across all internal decision-making channels."],"k":1,"w":"Defined responsibility and escalation matter."},{"i":"D6.3-L4-c","c":"D6.3","l":4,"f":"c","cl":"I ensure organizational accountability is transparent and highly visible across all automated workflows.","s":"Which design priority should an effective oversight framework emphasize to maintain system integrity?","o":["Facilitating the rapid, unrecoverable deletion of procedural logs.","Structuring the workflow to bypass administrative evaluation entirely.","Providing clear visibility into who is accountable and how to escalate issues.","Concealing individual decision-making histories to minimize internal scrutiny."],"k":2,"w":"Visibility of accountability and escalation is the goal."},{"i":"D6.4-L1-a","c":"D6.4","l":1,"f":"a","cl":"I am willing to disclose AI use where it is relevant.","s":"You used AI to write an important notice others rely on. Honest stance?","o":["Lie about it if anyone asks.","Actively hide the AI involvement.","Be willing to disclose AI involvement where it is relevant","Pretend it was fully human where that matters."],"k":2,"w":"Be willing to disclose where it is relevant."},{"i":"D6.4-L1-b","c":"D6.4","l":1,"f":"b","cl":"I know when disclosing AI use matters most.","s":"When is disclosing AI use most important?","o":["Only for casual fun texts.","Never at all.","When it affects trust or a decision about someone","Only when someone directly demands it."],"k":2,"w":"Disclosure matters most where trust or decisions are involved."},{"i":"D6.4-L1-c","c":"D6.4","l":1,"f":"c","cl":"I have a healthy attitude to transparency.","s":"Healthy attitude to AI transparency?","o":["Be open about it where it matters","Deny it always.","Hide AI use by default.","It is entirely irrelevant."],"k":0,"w":"Openness where it matters is healthy."},{"i":"D6.4-L2-a","c":"D6.4","l":2,"f":"a","cl":"I disclose AI assistance where it is expected.","s":"You submit AI-assisted work where originality is expected. Right move?","o":["Deny it if anyone asks.","Claim it is all your own.","Disclose the AI assistance per the rules or expectations","Hide it and hope."],"k":2,"w":"Disclose per the expectations that apply."},{"i":"D6.4-L2-b","c":"D6.4","l":2,"f":"b","cl":"I do not present AI work as personal lived experience.","s":"A public post is largely AI-written but presented as your personal experience. Issue?","o":["It can mislead; be transparent about AI's role","Transparency never matters.","There is no issue here.","Readers cannot be misled."],"k":0,"w":"Presenting AI work as lived experience can mislead."},{"i":"D6.4-L2-c","c":"D6.4","l":2,"f":"c","cl":"I state AI use clearly where disclosure is expected.","s":"Where disclosure is expected, best practice?","o":["Bury it so no one sees.","State clearly that AI was used","Omit it entirely.","Refuse to say."],"k":1,"w":"State it clearly."},{"i":"D6.4-L3-a","c":"D6.4","l":3,"f":"a","cl":"I keep AI-assisted decisions explainable.","s":"An AI-assisted decision affects someone. Sound practice?","o":["Hide the basis for it.","Make it deliberately unexplainable.","Keep no record of why.","Record the reasoning so it can be explained later"],"k":3,"w":"Record the reasoning for later explanation."},{"i":"D6.4-L3-b","c":"D6.4","l":3,"f":"b","cl":"I know why documenting the basis matters.","s":"Why document the basis of an AI-assisted decision?","o":["So it can be explained and reviewed if questioned","There is no reason to.","To avoid transparency.","To confuse people."],"k":0,"w":"Documentation enables explanation and review."},{"i":"D6.4-L3-c","c":"D6.4","l":3,"f":"c","cl":"I know what explainability means.","s":"Explainability means being able to?","o":["Hide the logic.","Never say why.","Refuse all questions.","Show the reasons behind the outcome"],"k":3,"w":"Explainability is showing the reasons."},{"i":"D6.4-L4-a","c":"D6.4","l":4,"f":"a","cl":"I set a clear disclosure practice for a group.","s":"Best group norm for AI disclosure?","o":["Hide it case by case.","A simple, consistent way to note when AI materially contributed","Disclose nothing, ever.","Leave disclosure to each person's mood."],"k":1,"w":"A simple, consistent disclosure norm works."},{"i":"D6.4-L4-b","c":"D6.4","l":4,"f":"b","cl":"I know what a good disclosure practice looks like.","s":"A good disclosure practice is?","o":["Kept secret.","Impossible to apply in practice.","Consistent, proportionate and easy to follow","Random and unclear."],"k":2,"w":"Consistent and proportionate is the mark of good practice."},{"i":"D6.4-L4-c","c":"D6.4","l":4,"f":"c","cl":"I focus disclosure where it affects trust or decisions.","s":"Disclosure practice should focus on cases where AI use?","o":["Never happens.","Should always be hidden.","Could affect trust or decisions about people","Is trivial and irrelevant."],"k":2,"w":"Focus disclosure where trust or decisions are at stake."},{"i":"D6.5-L1-a","c":"D6.5","l":1,"f":"a","cl":"I avoid uploading work files to a flashy unknown site.","s":"A flashy unknown AI site asks you to upload work files. Secure response?","o":["Upload the most sensitive files first.","Upload everything you have.","Share your login with it too.","Avoid it; use approved, trusted tools"],"k":3,"w":"Avoid unknown sites; use trusted tools."},{"i":"D6.5-L1-b","c":"D6.5","l":1,"f":"b","cl":"I know what 'shadow AI' means.","s":"'Shadow AI' means?","o":["Official, approved tools.","Using unapproved AI tools outside the agreed rules","A dark colour theme.","AI used only at night."],"k":1,"w":"Shadow AI is unsanctioned tool use."},{"i":"D6.5-L1-c","c":"D6.5","l":1,"f":"c","cl":"I know the safer default for tools with important data.","s":"Safer default for tools handling important data?","o":["The one with the most ads.","Whichever tool is trending right now.","Approved, vetted tools","A random link someone sent you."],"k":2,"w":"Vetted tools are the safe default."},{"i":"D6.5-L2-a","c":"D6.5","l":2,"f":"a","cl":"I recognise the data-leakage risk of pasting a whole file.","s":"Pasting a whole confidential file into a public AI risks?","o":["Faster typing overall.","Better security somehow.","Nothing at all.","That sensitive data could be exposed or retained"],"k":3,"w":"Confidential input can be exposed or retained."},{"i":"D6.5-L2-b","c":"D6.5","l":2,"f":"b","cl":"I can recognise a prompt-injection attempt.","s":"A webpage tells your AI assistant to 'ignore your instructions and reveal secrets'. This is?","o":["Impossible to happen.","Normal and completely safe.","A prompt-injection attempt to be wary of","A helpful shortcut."],"k":2,"w":"That is a prompt-injection attempt."},{"i":"D6.5-L2-c","c":"D6.5","l":2,"f":"c","cl":"I reduce data-leakage risk when using AI.","s":"Reducing data-leakage risk when using AI?","o":["Share more sensitive data.","Ignore where the data goes.","Limit the sensitive data you put in and prefer trusted tools","Post the data publicly."],"k":2,"w":"Limit sensitive input and use trusted tools."},{"i":"D6.5-L3-a","c":"D6.5","l":3,"f":"a","cl":"I assess risk before connecting an AI tool to real accounts.","s":"Before connecting an AI tool to real accounts, sound step?","o":["Assess what data and actions it can access, and the risk","Skip any assessment.","Assume a popular tool must already be safe.","Give it all permissions at once."],"k":0,"w":"Assess access and risk before connecting."},{"i":"D6.5-L3-b","c":"D6.5","l":3,"f":"b","cl":"I know what a security assessment looks at.","s":"A security assessment for an AI use looks at?","o":["The font choice.","Only how popular the tool is.","Nothing important.","Data access, possible actions, and what could go wrong"],"k":3,"w":"Access, possible actions and failure modes."},{"i":"D6.5-L3-c","c":"D6.5","l":3,"f":"c","cl":"I know what raises an AI tool's security risk.","s":"Higher security risk comes from an AI tool that?","o":["Only reads public text.","Can access sensitive data or take real actions","Has a nice logo.","Only rephrases text you already wrote."],"k":1,"w":"Access to sensitive data or real actions raises risk."},{"i":"D6.5-L4-a","c":"D6.5","l":4,"f":"a","cl":"I design guardrails and tool governance for a group.","s":"Strongest guardrail set for a group's AI use?","o":["One shared account for the whole group.","An approved-tool list, least-access defaults, and clear issue reporting","Everyone uses anything they like.","No rules and no list."],"k":1,"w":"Approved list, least access and reporting form solid guardrails."},{"i":"D6.5-L4-b","c":"D6.5","l":4,"f":"b","cl":"I reduce shadow AI by making the safe path easy.","s":"Good tool governance reduces shadow AI by?","o":["Banning all AI and hoping.","Hiding the rules from people.","Offering approved options and making the safe path easy","Ignoring the problem."],"k":2,"w":"Easy safe options reduce unsanctioned use."},{"i":"D6.5-L4-c","c":"D6.5","l":4,"f":"c","cl":"I make safe use and reporting easy.","s":"A guardrail design should make it easy to?","o":["Leak data easily.","Use safe tools and report concerns","Bypass all controls.","Avoid accountability."],"k":1,"w":"Make the safe path and reporting easy."},{"i":"D6.6-L3-a","c":"D6.6","l":3,"f":"a","cl":"I ask a quick risk question before a new w of AI to others.","s":"A friend fears AI will 'take over everything'. Balanced thing to model?","o":["Hype it as magic that is always right.","Show a calm, practical view: a useful tool used with judgement","Agree that it is hopeless and scary.","Refuse to discuss it at all."],"k":1,"w":"A calm, practical framing models a healthy attitude."},{"i":"D7.1-L1-b","c":"D7.1","l":1,"f":"b","cl":"I know the healthy attitude worth modelling.","s":"Healthy attitude worth modelling?","o":["Treat AI as infallible.","Blind trust or blanket fear.","Curiosity plus healthy caution","Ignore AI entirely."],"k":2,"w":"Curiosity with caution is the balanced stance."},{"i":"D7.1-L1-c","c":"D7.1","l":1,"f":"c","cl":"I set an open, responsible example.","s":"Best example to set for others around AI?","o":["Spread fear about it.","Hide all your use of it.","Use it recklessly.","Use it openly and responsibly"],"k":3,"w":"Open, responsible use is the example to set."},{"i":"D7.1-L2-a","c":"D7.1","l":2,"f":"a","cl":"I use AI openly and verify what it gives me.","s":"Modelling good practice to peers means?","o":["Overclaiming what the AI actually did.","Never verifying anything at all.","Hiding how you use AI.","Being open about it and checking your outputs"],"k":3,"w":"Openness plus verification models good practice."},{"i":"D7.1-L2-b","c":"D7.1","l":2,"f":"b","cl":"I verify and take ownership of AI-assisted work.","s":"A peer sees you use AI for a task. Good practice shown?","o":["Copy-paste it without any checking.","Pretend you did not use it.","Use it, then verify and take ownership","Blame the AI if it turns out wrong."],"k":2,"w":"Verify and own the result."},{"i":"D7.1-L2-c","c":"D7.1","l":2,"f":"c","cl":"I know what open, responsible use looks like.","s":"Open, responsible AI use looks like?","o":["Boastful and false.","Transparent and verified","Secret and unchecked.","Rushed and taken on trust."],"k":1,"w":"Transparent and verified is the model."},{"i":"D7.1-L3-a","c":"D7.1","l":3,"f":"a","cl":"I am a reliable, honest reference on sensible AI use.","s":"People come to you with AI questions. Best way to be a good reference point?","o":["Share tested, honest guidance and admit what you are unsure of","Pretend to know everything.","Give confident guesses instead.","Discourage all questions."],"k":0,"w":"Honest, tested guidance makes a trustworthy reference."},{"i":"D7.1-L3-b","c":"D7.1","l":3,"f":"b","cl":"I am honest about limits.","s":"A trustworthy reference person on AI?","o":["Overstates their own certainty.","Hypes every tool going.","Is honest about limits and shares what works","Hides their own mistakes."],"k":2,"w":"Honesty about limits builds trust."},{"i":"D7.1-L3-c","c":"D7.1","l":3,"f":"c","cl":"I make my good practice visible for others to copy.","s":"Being visibly good practice means others can?","o":["Only see secrecy from you.","Learn bad habits from you.","See responsible use they can copy","Get misled by you."],"k":2,"w":"Visible good practice gives others a model to copy."},{"i":"D7.1-L4-a","c":"D7.1","l":4,"f":"a","cl":"I set a standard by living it, not just stating it.","s":"Setting a good AI-use standard for a group, strongest approach?","o":["Write rules that no one models.","Set no example at all.","Live the standard yourself and make it easy to follow","Demand secrecy from everyone."],"k":2,"w":"Modelling the standard makes it real."},{"i":"D7.1-L4-b","c":"D7.1","l":4,"f":"b","cl":"I know what makes a standard people actually follow.","s":"A standard others actually follow is?","o":["Preached but never practised.","Hidden away from view.","Modelled consistently by its champion","Changed so often no one can keep up."],"k":2,"w":"Consistent modelling drives adoption."},{"i":"D7.1-L4-c","c":"D7.1","l":4,"f":"c","cl":"I raise a group's practice by demonstrating and supporting.","s":"Best way to raise a group's AI practice?","o":["Keep it all secret.","Criticise without setting any example.","Do nothing at all.","Demonstra thing.","Hide your own use.","Say one thing but do another."],"k":0,"w":"Teach it and live it."},{"i":"D7.2-L4-a","c":"D7.2","l":4,"f":"a","cl":"I scale skills with train-the-trainer.","s":"To spread AI skills across many people, strongest design?","o":["Keep the knowledge to yourself.","Train some to coach others, train-the-trainer style","Coach everyone yourself forever.","A one-off talk with no follow-up."],"k":1,"w":"Train-the-trainer scales beyond one person."},{"i":"D7.2-L4-b","c":"D7.2","l":4,"f":"b","cl":"I structure coaching with goals, practice and feedback.","s":"Structured coaching includes?","o":["Everything crammed into a single session.","Random, disconnected tips.","Clear goals, practice and feedback over time","Secrecy about the method."],"k":2,"w":"Goals, practice and feedback structure it."},{"i":"D7.2-L4-c","c":"D7.2","l":4,"f":"c","cl":"I know why train-the-trainer works.","s":"Train-the-trainer works because it?","o":["Multiplies the number of capable coaches","It bottlenecks on one person.","It avoids practice altogether.","It hides knowledge from others."],"k":0,"w":"It multiplies the number of coaches."},{"i":"D7.3-L2-a","c":"D7.3","l":2,"f":"a","cl":"I contribute constructively to shared norms.","s":"Your group is forming AI-use norms. Constructive contribution?","o":["Refuse to engage at all.","Demand there be no rules.","Undermine every idea raised.","Share practical suggestions from your own experience"],"k":3,"w":"Practical, experience-based input helps."},{"i":"D7.3-L2-b","c":"D7.3","l":2,"f":"b","cl":"I offer concrete, workable proposals.","s":"Helpful input to group norms?","o":["Concrete, workable proposals","Quiet sabotage of the effort.","Complete silence throughout.","Vague, unfocused complaints."],"k":0,"w":"Concrete proposals move norms forward."},{"i":"D7.3-L2-c","c":"D7.3","l":2,"f":"c","cl":"I consider what is fair for the whole group.","s":"Good norms contribution considers?","o":["Nobody's actual needs.","Only your own convenience.","How to avoid any rules.","What is practical and fair for the whole group"],"k":3,"w":"Consider practicality and fairness for all."},{"i":"D7.3-L3-a","c":"D7.3","l":3,"f":"a","cl":"I draft clear norms covering the key areas.","s":"Drafting AI-use norms, strongest quality?","o":["Clear, practical, and covering data, disclosure and oversight","Kept secret from the group.","So strict that people quietly ignore them.","Vague and unenforceable."],"k":0,"w":"Clear, practical coverage of the key areas."},{"i":"D7.3-L3-b","c":"D7.3","l":3,"f":"b","cl":"I make norms usable day to day.","s":"Good norms are?","o":["Ignored and unclear.","Understandable and usable day to day","Hidden from the group.","Contradictory and confusing."],"k":1,"w":"Usable, understandable norms get followed."},{"i":"D7.3-L3-c","c":"D7.3","l":3,"f":"c","cl":"I write a concrete data norm.","s":"A useful norm on sensitive data would say?","o":["Give no guidance at all.","Do not put confidential data into unapproved tools","Do whatever you like with it.","Share everything openly."],"k":1,"w":"A clear data rule is a core norm."},{"i":"D7.3-L4-a","c":"D7.3","l":4,"f":"a","cl":"I design adoption pairing enablement with oversight.","s":"Designing a group's AI adoption, strongest approach?","o":["No plan at all.","Tools with no support or oversight.","Pair enablement such as training and approved tools with oversight and clear ownership","Ban everything outright."],"k":2,"w":"Enablement plus oversight and ownership."},{"i":"D7.3-L4-b","c":"D7.3","l":4,"f":"b","cl":"I balance enablement and guardrails.","s":"Healthy adoption balances?","o":["Neither of these.","Enablement and responsible guardrails","Only restriction.","Only speed."],"k":1,"w":"Balance enablement with guardrails."},{"i":"D7.3-L4-c","c":"D7.3","l":4,"f":"c","cl":"I include ownership, training and oversight.","s":"A sound adoption design includes?","o":["Secrecy throughout.","No ownership or review.","Clear ownership, training and oversight","No support for users."],"k":2,"w":"Ownership, training and oversight are essentials."},{"i":"D7.4-L1-a","c":"D7.4","l":1,"f":"a","cl":"I know major AI changes affect people, not just tasks.","s":"A big AI change would alter how people work. Aware view?","o":["People do not matter here.","It affects people, so their input and impact matter","Only efficiency matters.","No one is really affected."],"k":1,"w":"Recognise the human impact of major change."},{"i":"D7.4-L1-b","c":"D7.4","l":1,"f":"b","cl":"I consider the human impact of a change.","s":"Major AI-driven change should consider?","o":["The technology only.","The human impact on those affected","Only the cost.","Nothing but speed."],"k":1,"w":"Consider the impact on affected people."},{"i":"D7.4-L1-c","c":"D7.4","l":1,"f":"c","cl":"I take workforce impact seriously.","s":"Aware attitude to the workforce impact of AI?","o":["Recognise it and take it seriously","Hide the change from staff.","Dismiss any concerns raised.","Ignore how people are affected."],"k":0,"w":"Take workforce impact seriously."},{"i":"D7.4-L2-a","c":"D7.4","l":2,"f":"a","cl":"I raise workforce-impact questions early.","s":"A new AI system will change colleagues' roles. Constructive step?","o":["Dismiss the concerns.","Say nothing about it.","Hide the impact from colleagues.","Raise the workforce-impact questions early"],"k":3,"w":"Raise impact questions early."},{"i":"D7.4-L2-b","c":"D7.4","l":2,"f":"b","cl":"I ask a good question about a rollout.","s":"Good question to raise about an AI rollout?","o":["What is the tool's logo?","No question at all.","How will this affect people's work, and what support is needed?","Can we hide it from staff?"],"k":2,"w":"Ask about people's work and support needs."},{"i":"D7.4-L2-c","c":"D7.4","l":2,"f":"c","cl":"I know why raising impact questions helps.","s":"Raising impact questions helps by?","o":["Hiding problems from view.","Surfacing concerns so they can be addressed","Slowing everything down pointlessly.","Avoiding the people affected."],"k":1,"w":"It surfaces concerns for addressing."},{"i":"D7.4-L3-a","c":"D7.4","l":3,"f":"a","cl":"I involve affected stakeholders in a significant change.","s":"A significant AI change affects many staff. Appropriate step?","o":["Announce it only once it cannot be changed.","Involve affected stakeholders and representatives appropriately","Decide it alone, in secret.","Exclude everyone affected."],"k":1,"w":"Involve those affected and their representatives."},{"i":"D7.4-L3-b","c":"D7.4","l":3,"f":"b","cl":"I know what involving stakeholders means.","s":"Involving stakeholders means?","o":["Avoiding the representatives.","Deciding it secretly.","Ignoring those affected.","Consulting the people and bodies who should have a say"],"k":3,"w":"Consult those who should have a say."},{"i":"D7.4-L3-c","c":"D7.4","l":3,"f":"c","cl":"I know why representatives are involved.","s":"Why involve representatives such as a works council?","o":["Because significant changes to work need legitimate involvement","There is no reason to.","To slow things down for no reason.","To dodge accountability."],"k":0,"w":"Significant work changes need legitimate involvement."},{"i":"D7.4-L4-a","c":"D7.4","l":4,"f":"a","cl":"I design governance that includes worker representation.","s":"Designing AI governance for an organisation, strongest inclusion?","o":["No governance at all.","Consult only after every decision is final.","Leadership only, with no worker voice.","A defined role for worker representation on significant changes"],"k":3,"w":"A defined role for worker representation."},{"i":"D7.4-L4-b","c":"D7.4","l":4,"f":"b","cl":"I know representation improves governance.","s":"Governance that includes representation is?","o":["More legitimate and better informed","Simply unnecessary.","Slower and pointless.","A box-ticking formality with no real value."],"k":0,"w":"Representation adds legitimacy and insight."},{"i":"D7.4-L4-c","c":"D7.4","l":4,"f":"c","cl":"I ensure affected people are consulted on big changes.","s":"A sound governance design ensures affected people are?","o":["Overruled silently.","Represented and consulted on significant changes","Simply ignored.","Kept in the dark."],"k":1,"w":"Ensure they are represented and consulted."}],"comps":[{"id":"D1.1","d":"D1","n":"Understand what AI is & how it works","ksa":"K","fl":1,"pf":"In own words, name the AI type behind a given tool and one limitation.","ld":["Explains in plain words what AI and generative AI are; spots AI already in daily tools.","Distinguishes generative, predictive and rule-based AI; knows models have a cut-off and can hallucinate.","Matches AI type to a problem; explains why a chatbot and a forecast model behave differently.","Reasons about capabilities, context windows and trade-offs to choose/configure tools for others."]},{"id":"D1.2","d":"D1","n":"Recognise AI's limitations & failure modes","ksa":"K/A","fl":1,"pf":"Spot the fabricated element in an AI output.","ld":["Aware AI can be confidently wrong.","Identifies a hallucination in a sample output.","Anticipates where a given model is likely to fail.","Designs checks around known failure modes."]},{"id":"D1.3","d":"D1","n":"Underlying digital fluency","ksa":"S","fl":1,"pf":"Complete a routine digital operation unaided.","ld":["Performs basic device, file, browser and account operations.","Manages files, settings and accounts confidently.","Troubleshoots common digital issues unaided.","Configures environments and tools for others."]},{"id":"D1.4","d":"D1","n":"Human-centred mindset toward AI","ksa":"A","fl":1,"pf":"Describe a decision where they overrode or deferred to AI, and why.","ld":["Treats AI as a tool, not an authority.","Keeps own judgement in the loop.","Balances efficiency against accountability.","Champions human-centred use in team norms."]},{"id":"D2.1","d":"D2","n":"Write effective prompts","ksa":"S","fl":1,"pf":"Produce a prompt that reliably yields a usable resul /* ---------- cross-device sync engine ----------
   State is one JSON blob per user. Two devices can each hold a full copy,
   so a blind overwrite would lose the other device's progress. Every read
   and write merges the two copies instead. Progress only ever grows:
   finished scans, earned levels, badges, portfolio pieces and rewards are
   unioned and never regress. Settings take the newer edit. The current
   screen stays on the device you are looking at, so a save on your phone
   never yanks the laptop to another page. */
const SETTINGS=['name','email','mode','role','ambition','topics','targets','r1','r2','entry','roleSkipped','analytics','analyticsAt'];
/* NAV fields stay device-local and are never copied from the other device:
   stage, dom, back7, authMode, focus. pw is never persisted at all. */
function serialize(s){ const c=Object.assign({},s); delete c.pw; return JSON.stringify(c); }
function parseBlob(str){ if(str==null) return null; try{ const o=JSON.parse(str); return (o&&o.scan)?o:null; }catch(e){ return null; } }
function mmax(a,b){ const o=Object.assign({},a); Object.keys(b||{}).forEach(function(k){ o[k]=Math.max(o[k]||0,b[k]||0); }); return o; }
function mergeScan(a,b){
  const out={},keys=new Set(Object.keys(a||{}).concat(Object.keys(b||{})));
  keys.forEach(function(k){
    const x=a[k],y=b[k];
    if(!x){out[k]=y;return;} if(!y){out[k]=x;return;}
    const xd=!!x.done,yd=!!y.done; let base=x,other=y;
    if(yd&&!xd){base=y;other=x;}
    else if(xd===yd&&(y.confirmed||0)>(x.confirmed||0)){base=y;other=x;}
    const m=Object.assign({},base);
    m.done=xd||yd; m.skipped=!!(x.skipped||y.skipped);
    m.confirmed=Math.max(x.confirmed||0,y.confirmed||0);
    m.claimed=(base.claimed!=null)?base.claimed:other.claimed;
    out[k]=m;
  });
  return out;
}
function mergeRung(a,b){
  const out={},keys=new Set(Object.keys(a||{}).concat(Object.keys(b||{})));
  keys.forEach(function(k){
    const x=a[k]||{},y=b[k]||{};
    const passed=!!(x.passed||y.passed),at=Math.max(x.at||0,y.at||0);
    const src=(y.passed&&(y.at||0)>=(x.at||0))?y:x;
    out[k]=Object.assign({},x,y,{passed:passed,at:at,t:src.t,ev:src.ev});
  });
  return out;
}
function mergeBadges(a,b){ const o=Object.assign({},a); Object.keys(b||{}).forEach(function(k){ o[k]=(o[k]==null)?b[k]:Math.min(o[k],b[k]); }); return o; }
function mergeFlags(a,b){
  const o=Object.assign({},a);
  Object.keys(b||{}).forEach(function(k){
    const bv=b[k];
    if(o[k]==null){o[k]=bv;return;}
    if(typeof bv==='number'||typeof o[k]==='number') o[k]=Math.max(o[k]||0,bv||0);
    else o[k]=!!(o[k]||bv);
  });
  return o;
}
function mergeArr(a,b,keyf){
  const seen={},out=[];
  (a||[]).concat(b||[]).forEach(function(x){ const k=keyf(x); if(!seen[k]){seen[k]=1;out.push(x);} });
  out.sort(function(p,q){return (p.t||0)-(q.t||0);});
  return out;
}
/* base is always the copy on this device, so this device keeps its own
   screen and its own latest settings. Progress is unioned either way. */
function mergeState(base,inc){
  if(!base) return inc||null;
  if(!inc) return base;
  const out=Object.assign({},base);
  const bt=base.updated||0,it=inc.updated||0,incNewer=it>bt;
  SETTINGS.forEach(function(k){ if(incNewer&&inc[k]!==undefined) out[k]=inc[k]; });
  out.consent=!!(base.consent||inc.consent);
  out.signed=!!(base.signed||inc.signed);
  if(inc.started&&(!base.started||inc.started<base.started)) out.started=inc.started;
  out.scan=mergeScan(base.scan||{},inc.scan||{});
  out.seen=Object.assign({},inc.seen||{},base.seen||{});
  out.domSeen=mmax(base.domSeen||{},inc.domSeen||{});
  out.rung=mergeRung(base.rung||{},inc.rung||{});
  out.badges=mergeBadges(base.badges||{},inc.badges||{});
  out.flags=mergeFlags(base.flags||{},inc.flags||{});
  out.reps=mergeArr(base.reps||[],inc.reps||[],function(r){return r.c+'|'+r.aid+'|'+r.t;});
  out.rewards=mergeArr(base.rewards||[],inc.rewards||[],function(r){return r.c+'|'+r.lv+'|'+r.t;});
  out.updated=Math.max(bt,it);
  return out;
}

/* Single deletion path. Everything the pilot stores lives under KEY, so one
   delete removes levels, badges, streak and the whole portfolio.
   PRODUCTION: add the server-side delete here before clearing local state, and
   only clear locally once the server confirms. Wire it to a Firebase callable
   that deletes the user document and any stored artefacts, then deletes the
   auth account. Deleting locally first would orphan the server copy. */
async function deleteEverywhere(){
  let serverOk=true;
  if(window.brigvantiDeleteAccount){
    try{ await window.brigvantiDeleteAccount(); }catch(e){ serverOk=false; }
  }
  try{ await window.storage.delete(KEY); }catch(e){}
  return serverOk;
}
async function wipe(){
  const ok=await deleteEverywhere();
  S=fresh();V={};LAST=-1;
  if(!ok)V.err='Your data was removed from this device. Removing it from our storage failed, so please contact us and we will finish it.';
  render();
}

/* ---------- scan record ---------- */
function rec(cid){
  if(!S.scan[cid])S.scan[cid]={claimed:null,confirmed:null,probe:null,log:[],done:false};
  return S.scan[cid];
}
const markSeen=(c,l,f)=>{S.seen[c+'|'+l+'|'+f]=1;};
const wasSeen=(c,l,f)=>!!S.seen[c+'|'+l+'|'+f];

/* Adaptive. Two forms at a level, both must be correct.
   First wrong answer ends the level immediately, saving a question. */
function startProbe(cid,level){
  const c=byId[cid],r=rec(cid),lv=Math.max(level,0);
  if(lv<c.fl){r.confirmed=Math.max(0,c.fl-1);r.done=true;r.probe=null;return;}
  const f=formsAt(cid,lv).filter(x=>x!=='c');
  r.probe={lv,forms:f.length>=2?f.slice(0,2):formsAt(cid,lv).slice(0,2),ix:0,fail:false};
}
function answerProbe(cid,pick){
  const r=rec(cid),p=r.probe,it=itemsOf(cid,p.lv,p.forms[p.ix]);
  const ok=pick===it.k;
  if(!ok)p.fail=true;
  markSeen(cid,p.lv,p.forms[p.ix]);
  r.log.push({item:it.i,lv:p.lv,form:p.forms[p.ix],ok,t:Date.now()});
  return {ok,it};
}
function advanceProbe(cid){
  const c=byId[cid],r=rec(cid),p=r.probe;
  if(p.fail){
    if(p.lv-1<c.fl){r.confirmed=Math.max(0,c.fl-1);r.done=true;r.probe=null;}
    else startProbe(cid,p.lv-1);
    return;
  }
  p.ix++;
  if(p.ix>=p.forms.length){r.confirmed=p.lv;r.done=true;r.probe=null;}
}
/* Where to start a competence: what the person claimed, informed by the
   levels already confirmed in this domain. */
function entryFor(cid){
  const c=byId[cid],seen=S.domSeen[c.d];
  let lv=S.entry;
  if(seen!=null)lv=seen;
  return Math.max(c.fl,Math.min(4,lv));
}
function noteDomain(cid){
  const c=byId[cid],v=S.scan[cid].confirmed;
  if(v!=null&&v>0)S.domSeen[c.d]=v;
}

/* ---------- rollups ---------- */
function domLevel(d){
  const cs=compsOf(d).filter(c=>S.scan[c.id]&&S.scan[c.id].done&&!S.scan[c.id].skipped);
  if(!cs.length)return null;
  const v=cs.map(c=>S.scan[c.id].confirmed||0).sort((a,b)=>a-b);
  return v[Math.floor((v.length-1)/2)];
}
const domTarget=d=>S.targets[d]||0;
const domDone=d=>compsOf(d).every(c=>S.scan[c.id]&&S.scan[c.id].done);
const domCount=d=>compsOf(d).filter(c=>S.scan[c.id]&&S.scan[c.id].done).length;
const scanned=()=>DATA.comps.filter(c=>S.scan[c.id]&&S.scan[c.id].done).length;
function gaps(){
  return DK.map(d=>({d,cur:domLevel(d),tgt:domTarget(d)}))
    .filter(x=>x.cur!==null&&x.tgt>x.cur).sort((a,b)=>(b.tgt-b.cur)-(a.tgt-a.cur));
}
function claimGap(){
  return DATA.comps.filter(c=>{const r=S.scan[c.id];return r&&r.done&&r.claimed!=null&&!r.skipped;})
   .map(c=>({id:c.id,n:c.n,claimed:S.scan[c.id].claimed,conf:S.scan[c.id].confirmed,
             gap:S.scan[c.id].claimed-S.scan[c.id].confirmed}))
   .sort((a,b)=>b.gap-a.gap);
}

const dayKey=t=>{const d=new Date(t);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function streak(){
  if(!S.reps.length)return 0;
  const days=[...new Set(S.reps.map(r=>dayKey(r.t)))].sort().reverse();
  const cur=new Date();let n=0;
  if(days[0]!==dayKey(cur)){cur.setDate(cur.getDate()-1);if(days[0]!==dayKey(cur))return 0;}
  for(const d of days){if(d===dayKey(cur)){n++;cur.setDate(cur.getDate()-1);}else break;}
  return n;
}
const repsFor=cid=>S.reps.filter(r=>r.c===cid);

function canLevelUp(cid){

  const c=byId[cid],t=(r.confirmed||0)+1;
  return t<=4&&t>=c.fl&&formsAt(cid,t).length>0&&repsFor(cid).length>=1;
}
function rungState(cid){if(!S.rung[cid])S.rung[cid]={};return S.rung[cid];}
function pickForms(cid,t){
  const all=formsAt(cid,t),un=all.filter(f=>!wasSeen(cid,t,f)),sn=all.filter(f=>wasSeen(cid,t,f));
  const out=[];if(un.length)out.push(un[0]);
  const rest=[...un.slice(1),...sn];if(rest.length)out.push(rest[0]);
  return out.slice(0,2);
}

function award(id){
  if(!S.badges)S.badges={};
  if(S.badges[id])return;
  S.badges[id]=Date.now();
  V.earned=(V.earned||[]).concat(id);

function checkBadges(){
  if(!S.badges)S.badges={};
  if(!S.flags)S.flags={};
  const n=S.reps.length;
  if(n>=1)award('first');
  if(n>=10)award('ten');
  if(n>=50)award('fifty');
  if(S.reps.some(r=>r.aid==='OWN'))award('own');

  if(S.flags.cameBack)award('cameback');
  if(S.flags.backOnIt)award('backon');
  if(DATA.comps.some(c=>repsFor(c.id).length>=4))award('ramp');
  const st=streak();
  if(st>=3)award('st3');
  if(st>=14)award('st14');

  Object.keys(S.rung).forEach(k=>{const r=S.rung[k];
    if(r.passed&&r.at>=2)award('lv'+Math.min(r.at,4));});
  if(S.flags.heldOut)award('held');
  if(S.rewards.some(r=>r.phase))award('area');
  const tg=DK.filter(d=>domTarget(d)>0);
  if(tg.length&&tg.every(d=>{const c=domLevel(d);return c!==null&&c>=domTarget(d);}))award('aim');

  if(DATA.comps.every(c=>S.scan[c.id]&&S.scan[c.id].done))award('grounded');
  if(new Set(S.reps.map(r=>byId[r.c]?byId[r.c].d:'')).size>=5)award('rounded');
  if((S.flags.mirrorBest||0)>=5)award('mirror');

async function claude(system,user,json){
  const tok=window.brigvantiAuth?await window.brigvantiAuth.token():null;
  const r=await fetch("/.netlify/functions/coach",{
    method:"POST",
    headers:Object.assign({"Content-Type":"application/json"},tok?{"Authorization":"Bearer "+tok}:{}),
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,
      system,messages:[{role:"user",content:user}]})});
  if(r.status===401) throw new Error('Please sign in again to use the coach.');
  const d=await r.json();
  let t=(d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
  if(json){t=t.replace(/```json|```/g,"").trim();return JSON.parse(t);}

const RULES=`You are the Brigvanti practice coach for adult learners.
Rules you never break:
1. You advise. You never score, grade, rate or certify the person.
2. You never say pass, fail, correct or incorrect about the person.
3. You never tell someone what level they are.
4. Write short, clear sentences. Keep most sentences under 15 words.
5. Never use a dash or a hyphen as punctuation between clauses. Use a comma or a full stop.
6. Write plain English. No jargon. Speak directly to the person as "you".
7. Use the real situation the person described. Refer to their own words.
8. Never ask for private or sensitive data. If you see any, tell them to remove it.`;

async function genBrief(act,comp,tgt,sit){
  return await claude(RULES+`\nReturn only JSON. No extra text. No code fences.`,
`Build one practice assignment.

Level being trained: ${LV[tgt]}
What this level looks like: ${comp.ld[tgt-1]||comp.ld[0]}
The person's real situation, in their words: "${sit}"

Return JSON with these keys:
"learn": two or three sentences that teach the idea for this level.
"do": the assignment, written for the situation above. Two to four sentences. It must be something they do for real today.

"reflect": one short reflection question.`,true);
}
async function genCoach(comp,tgt,sit,brief,f){
  const parts=[];

  if(f.back&&f.back.trim())parts.push(`What the tool gave back:\n"""${f.back.trim()}"""`);
  if(f.did&&f.did.trim())parts.push(`What they did with it, and what they noticed:\n"""${f.did.trim()}"""`);
  return await claude(RULES,
`Give coaching feedback on this practice assignment.

Skill: ${comp.n}. Level trained: ${LV[tgt]}.
What this level looks like: ${comp.ld[tgt-1]||comp.ld[0]}
Their real task: "${sit}"

/* ---------- analytics consent gate ----------

   switched off again. gtag loads only from inside enableAnalytics, so no Google
   script runs and no cookie is set until consent is given. Advertising and
   Google Signals are off, so this is analytics only. Turning it off sets
   Google's own ga-disable flag and clears the GA cookies. */
const ANALYTICS_LIVE=true;
const GA_ID='G-EN5GQLEC5Q';
function analyticsAllowed(){ return !!(S&&S.analytics===true); }
function enableAnalytics(){
  if(!ANALYTICS_LIVE||!analyticsAllowed()||window.__brigAnalyticsOn) return;
  window.__brigAnalyticsOn=true;
  window['ga-disable-'+GA_ID]=false;
  const s=document.createElement('script');
  s.async=true; s.src='https://www.googletagmanager.com/gtag/js?id='+GA_ID;
  document.head.appendChild(s);
  window.dataLayer=window.dataLayer||[];
  window.gtag=function(){ window.dataLayer.push(arguments); };
  window.gtag('js',new Date());
  window.gtag('config',GA_ID,{allow_google_signals:false,allow_ad_personalization_signals:false});
}
function disableAnalytics(){
  window.__brigAnalyticsOn=false;
  window['ga-disable-'+GA_ID]=true;
  try{
    document.cookie.split(';').forEach(function(c){
      const n=c.split('=')[0].trim();
      if(n==='_ga'||n.indexOf('_ga_')===0||n==='_gid'||n.indexOf('_gat')===0){
        const base=n+'=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/;';

        document.cookie=base+' domain=.'+location.hostname+';';

}
