<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brigvanti</title>
<style>
:root{
  --ink:#14202B; --ink2:#4A5C6B; --ink3:#7A8B98;
  --bg:#F6F4F0; --card:#FFFFFF; --soft:#F2F5F7;
  --line:#E3E8EC; --line2:#EFF3F5;
  --teal:#0E8C7F; --teal-d:#0A6459; --teal-l:#E2F4F1;
  --indigo:#4B4DB5; --indigo-l:#ECEDFB;
  --amber:#E39A16; --amber-d:#8A5B04; --amber-l:#FDF1DC;
  --rose:#C6553F; --rose-l:#FBEBE7;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
h1{font-size:25px;line-height:1.25;font-weight:700;margin:0 0 8px;letter-spacing:-.02em}
h2{font-size:20px;line-height:1.3;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
h3{font-size:16px;font-weight:600;margin:0}
p{margin:0 0 12px}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* app frame */
.app{max-width:560px;margin:0 auto;padding:0 16px 110px;min-height:100vh}
.top{position:sticky;top:0;background:var(--bg);padding:12px 0 10px;z-index:20}
.topbar{display:flex;align-items:center;gap:12px;min-height:36px}
.back{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;flex:0 0 auto;font-size:18px;color:var(--ink2)}
.back:active{transform:scale(.94)}
.crumb{font-size:13px;color:var(--ink3);font-weight:500}
.track{height:5px;background:var(--line2);border-radius:99px;margin-top:10px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--teal),var(--indigo));transition:width .45s cubic-bezier(.4,0,.2,1)}

/* cards */
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:14px;
  box-shadow:0 1px 2px rgba(20,32,43,.05),0 6px 18px rgba(20,32,43,.04)}
.card.tint{background:var(--teal-l)}
.card.warm{background:var(--amber-l)}
.lede{color:var(--ink2);font-size:16px;margin-bottom:16px}
.muted{color:var(--ink3);font-size:14px}
.eyebrow{font-size:13px;font-weight:600;color:var(--teal);margin-bottom:6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--ink);color:#fff;border-radius:99px;padding:14px 24px;font-weight:600;
  min-height:50px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn:disabled{background:#C3CDD4;cursor:not-allowed}
.btn.go{background:var(--teal)}
.btn.sec{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.full{display:flex;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.row .btn{flex:1 1 auto}
.abar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);color:#fff;
  padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.abar-in{max-width:528px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.abar-txt{font-size:14px;line-height:1.45}
.abar a{color:#fff;text-decoration:underline}
.abar-btns{display:flex;gap:10px}
.abar-btns .btn{flex:1 1 0;min-height:44px;padding:10px 16px}

/* options */
.opt{display:block;width:100%;text-align:left;background:var(--card);border-radius:14px;
  padding:15px 16px;margin-bottom:10px;line-height:1.45;box-shadow:inset 0 0 0 1px var(--line);
  transition:transform .1s,box-shadow .15s,background .15s}
.opt:active{transform:scale(.985)}
.opt.sel{background:var(--teal-l);box-shadow:inset 0 0 0 2px var(--teal)}
.opt.ok{background:var(--teal-l);box-shadow:inset 0 0 0 2px var(--teal)}
.opt.no{background:var(--rose-l);box-shadow:inset 0 0 0 2px var(--rose)}
.opt .tag{display:block;font-size:12.5px;color:var(--ink3);font-weight:600;margin-bottom:4px}
.opt .sub{display:block;font-size:13.5px;color:var(--ink2);margin-top:5px}
.opt b{font-weight:600}

/* sign in */
.sso{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  background:var(--card);border-radius:99px;padding:14px;font-weight:600;min-height:52px;
  box-shadow:inset 0 0 0 1px var(--line);margin-bottom:10px}
.sso:active{transform:scale(.98)}
.sso .g{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:700;color:#fff}
.divider{display:flex;align-items:center;gap:12px;color:var(--ink3);font-size:13px;margin:16px 0}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}

/* level chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;
  padding:5px 11px;border-radius:99px;background:var(--soft);color:var(--ink2)}
.chip.t{background:var(--teal-l);color:var(--teal-d)}
.chip.a{background:var(--amber-l);color:var(--amber-d)}
.chip.i{background:var(--indigo-l);color:var(--indigo)}

/* domain cards */
.dom{display:block;width:100%;text-align:left;background:var(--card);border-radius:14px;
  padding:15px 16px;margin-bottom:10px;box-shadow:inset 0 0 0 1px var(--line);transition:transform .1s}
.dom:active{transform:scale(.985)}
.dom-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dom-h b{font-weight:600;font-size:15.5px;flex:1}
.steps{display:flex;gap:5px}
.step{flex:1;height:8px;border-radius:99px;background:var(--line2)}
.step.f{background:var(--teal)}
.step.g{background:repeating-linear-gradient(45deg,var(--amber-l),var(--amber-l) 4px,#F7E3BE 4px,#F7E3BE 8px)}
.arrow{color:var(--ink3);font-size:18px}

/* streak */
.streak{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#FDF1DC,#FBE6C6);
  border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.flame{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;
  font-size:22px;font-weight:700;color:var(--amber-d);flex:0 0 auto}
.streak b{display:block;font-size:15px}

/* coach */
.coach{background:var(--indigo-l);border-radius:var(--r);padding:17px 18px;margin:14px 0;
  white-space:pre-wrap;line-height:1.62}
.coach h4{margin:0 0 8px;font-size:13.5px;font-weight:700;color:var(--indigo)}
.why{background:var(--soft);border-radius:12px;padding:13px 15px;margin-top:14px;font-size:14.5px;color:var(--ink2)}
.why b{color:var(--ink);display:block;margin-bottom:3px;font-size:14px}

/* forms */
textarea,input,select{font-family:inherit;font-size:16px;width:100%;padding:13px 14px;
  border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);line-height:1.5}
textarea:focus,input:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal)}
textarea{min-height:120px;resize:vertical}
label.fl{display:block;font-size:15px;font-weight:600;margin:0 0 6px}
.err{color:var(--rose);font-size:14px;margin-top:8px;font-weight:500}

/* checklist */
.chk{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;margin-bottom:9px;
  background:var(--card);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.chk.on{background:var(--teal-l);box-shadow:inset 0 0 0 2px var(--teal)}
.chk input{width:22px;height:22px;flex:0 0 auto;margin:1px 0 0;accent-color:var(--teal)}

/* progress screen */
.tile{background:var(--card);border-radius:14px;padding:16px;text-align:center}
.tile b{display:block;font-size:28px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.tile span{font-size:12.5px;color:var(--ink3)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mtiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.mtile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 12px;text-align:center;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:100px;transition:background .15s ease,border-color .15s ease,transform .06s ease}
.mtile:hover{background:var(--teal-l);border-color:var(--teal)}
.mtile:active{transform:scale(.97)}
.mtile .mi{font-size:23px;line-height:1}
.mtile b{font-size:13.5px;font-weight:700;line-height:1.25}
.mtile.warn:hover{background:var(--amber-l);border-color:var(--amber)}
.fold{border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin:14px 0;overflow:hidden}
.fold>summary{list-style:none;cursor:pointer;padding:17px 18px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:17px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary .fx{color:var(--ink3);font-size:13px;font-weight:600}
.fold .fb{padding:0 18px 18px}
.line{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2)}
.line:last-child{border-bottom:0}
.line .nm{flex:1;font-size:15px;font-weight:500;line-height:1.35}
.line .nm span{display:block;font-size:12.5px;color:var(--ink3);font-weight:400}
.note{background:var(--soft);border-radius:12px;padding:14px 16px;margin:12px 0;font-size:14.5px;color:var(--ink2)}
.note b{color:var(--ink)}

.toast{position:fixed;left:16px;right:16px;bottom:22px;z-index:60;max-width:528px;margin:0 auto;
  background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px;font-size:14.5px;line-height:1.5;
  box-shadow:0 8px 28px rgba(20,32,43,.28);display:flex;gap:11px;align-items:flex-start;
  animation:rise .28s cubic-bezier(.34,1.4,.64,1)}
.toast .ic{flex:0 0 auto;font-size:17px;line-height:1.3}
.toast button{color:#9FD8D0;font-weight:600;flex:0 0 auto;padding:0 0 0 6px}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;
  border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pop{animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
@media(min-width:620px){.app{padding:0 24px 110px}h1{font-size:29px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA =
{"items":[{"i":"D1.1-L1-a","c":"D1.1","l":1,"f":"a","cl":"I can spot when an everyday tool is using AI.","s":"Which of these everyday things is most likely powered by AI?","o":["A photo app that automatically groups pictures of the same person's face","An online shopping cart that calculates your volume discount code and free shipping instantly.","A password creation box that immediately flags your entry if it is missing a special character.","A banking app that automatically sorts a list of products from lowest to highest price."],"k":0,"w":"Face grouping learns visual patterns (AI). The others run fixed rules or hardware, no learning."},{"i":"D1.1-L1-b","c":"D1.1","l":1,"f":"b","cl":"I can explain in plain words what generative AI does.","s":"A friend asks what a chatbot like ChatGPT actually does when it answers. Best plain-language description?","o":["It looks up the one correct answer in a fixed database","It records what people type and replays it","It predicts likely next words from patterns in text it was trained on","It searches the live internet for every answer in real time"],"k":2,"w":"Generative text models predict likely continuations from training patterns; they are not a lookup table or live search by default."},{"i":"D1.1-L1-c","c":"D1.1","l":1,"f":"c","cl":"I can spot the difference between an AI-driven tool and a static algorithm","s":"Which everyday feature most likely uses AI rather than a fixed rule?","o":["A navigation map that displays your exact estimated arrival time using the distance divided by the speed limit.","A customer support chatbot that strictly asks you to select from 3 pre-written buttons to route your call.","A keyboard that suggests your next word from how you usually write","A fitness tracker that triggers an alarm when your heart rate goes over a preset limit."],"k":2,"w":"Next-word suggestion learns from your text patterns; the others follow fixed timing or mechanics."},{"i":"D1.1-L2-a","c":"D1.1","l":2,"f":"a","cl":"I can tell generative, predictive and rule-based AI apart.","s":"Your bank flags a payment as unusual. Which version is doing this with AI, not just a fixed rule?","o":["Since staff update the country blocklist regularly, it appears to learn new risks.","Because you set the 1,000 euro limit yourself, it feels tailored and intelligent.","Since it reacts to the amount each time, it looks like it judges risk.","Because it learns your normal spending pattern, it flags anything that deviates."],"k":3,"w":"Learning a pattern to judge 'unusual' is predictive AI; the others are fixed thresholds and lists."},{"i":"D1.1-L2-b","c":"D1.1","l":2,"f":"b","cl":"I can explain in plain words what a predictive model does.","s":"A weather app shows tomorrow's rain chance as 70%. In plain terms, how does a predictive model reach that?","o":["Because a forecaster enters the figure by hand, the app simply displays it.","Since the model can access tomorrow's actual conditions, it reports them early.","By finding patterns in past weather data, it estimates how likely rain is.","Because tomorrow usually resembles today, it copies today's weather forward as the forecast."],"k":2,"w":"Prediction is pattern-based likelihood from historical data, not foresight, copying or manual entry."},{"i":"D1.1-L2-c","c":"D1.1","l":2,"f":"c","cl":"I know AI models have a knowledge cut-off and can make things up.","s":"An AI confidently names the winner of a match 'played yesterday'. Why stay cautious even though it sounds certain?","o":["Because AI systems are barred from sports data, they should not answer such questions.","Since the reply sounds certain and detailed, its confidence shows it must be correct.","Because it can quietly access live results online, its answer is probably accurate.","Because it lacks live data past its training cut-off, it can invent a convincing answer."],"k":3,"w":"Without live access it can fabricate recent specifics; confidence is not evidence."},{"i":"D1.1-L3-a","c":"D1.1","l":3,"f":"a","cl":"I can match the right kind of AI to a problem.","s":"You need a tool that gives the exact same standard reply to a fixed question every single time. Best fit, and why not a chatbot?","o":["Since identical output is needed every time, use a fixed rule rather than generation.","Because an image generator produces polished results, it can supply the standard reply.","Since a modern chatbot is the newest option, it will handle the task best.","Because a predictive model estimates the likely answer, it will repeat that answer consistently."],"k":0,"w":"Deterministic, identical output is a rules job; generative tools vary by design."},{"i":"D1.1-L3-b","c":"D1.1","l":3,"f":"b","cl":"I can explain why two AI tools behave differently.","s":"A chatbot gives a slightly different reply each time; a spam filter gives a steady yes or no. Best explanation?","o":["Because the chatbot gives different replies, it must be malfunctioning.","Since both are AI systems, they must work the same way underneath.","Because the filter only says yes or no, it is not really AI.","The chatbot samples among likely word paths, while the filter returns one fixed classification."],"k":3,"w":"Generation samples and varies; classification returns one decision."},{"i":"D1.1-L3-c","c":"D1.1","l":3,"f":"c","cl":"I can tell when a task needs AI at all, or when a simple rule is better.","s":"You want to sort a list of expenses from highest to lowest. Is AI the right tool here?","o":["Because a plain sort does this exactly, AI would be needless overkill.","Since sorting a long list is difficult, ordinary software cannot do it well.","Because ranking values feels intelligent, only an AI tool can produce the order.","Since arranging items involves judgement, sorting counts as a creative, generative task."],"k":0,"w":"A deterministic sort is exact and cheap; reaching for AI adds cost and uncertainty for no gain."},{"i":"D1.1-L4-a","c":"D1.1","l":4,"f":"a","cl":"I can reason about an AI tool's limits when setting it up for others.","s":"You set up an AI to summarise very long documents for your group, but its context window is small. What real consequence must you design around?","o":["Because the window is small, the tool rejects any words above a certain length.","Since the window governs image size, it has no effect on text documents.","When the window is too small, the tool reads only part and drops later sections.","Because the window is limited, the tool cannot process any of the document."],"k":2,"w":"A small context window truncates long input; content past the limit is silently missed."},{"i":"D1.1-L4-b","c":"D1.1","l":4,"f":"b","cl":"I can choose and justify the right type of AI for someone else's need.","s":"A relative wants AI to identify birds from photos they take. Which capability decides whether a tool can even do this?","o":["Since the best-known brand is most capable, popularity decides whether it can do this.","Because the task needs photos, the tool must accept image input, not only text.","Since a well-designed app has more features, its interface options determine what it can do.","Because it writes long, fluent essays, its text skill shows it can also see images."],"k":1,"w":"The task needs image understanding, so multimodal input is the deciding capability."},{"i":"D1.1-L4-c","c":"D1.1","l":4,"f":"c","cl":"I can explain a capability trade-off to a non-expert.","s":"A friend asks why the free AI 'sometimes just makes things up'. Best plain explanation of the trade-off?","o":["Because it predicts likely text, it stays flexible but can state confident wrong details.","Because it chooses to deceive, its wrong answers are deliberate lies.","Since paid models are flawless, only the free version invents details.","Because it sometimes errs, the tool is faulty and not worth using."],"k":0,"w":"Fluency and flexibility come from prediction, which is also why it can be confidently wrong."},{"i":"D1.2-L1-a","c":"D1.2","l":1,"f":"a","cl":"I know AI can sound confident and still be wrong.","s":"An AI answer includes a precise line: 'A 2023 Leiden trial showed a 34% improvement.' Why treat this with care?","o":["AI can convincingly invent precise details like a named study and figure.","Because a language model cannot do maths, every figure it gives is unreliable.","Because a single national institution is hard to verify abroad, the source seems doubtful.","Because a 34% jump is unusually large, the number is probably an error."],"k":0,"w":"Specific sources and stats are a classic fabrication tell; check them, do not assume all numbers are fake."},{"i":"D1.2-L1-b","c":"D1.2","l":1,"f":"b","cl":"I know AI does not truly understand the way a person does.","s":"Why might an AI write a grammatically perfect reply that still misses what you actually meant?","o":["Because it predicts fluent text without grasping meaning, it can be smooth yet off-target.","Because the model was in a poor mood, it answered carelessly.","Since it fully understood your intent, it simply chose to ignore it.","Because flawless grammar is beyond AI, the reply only looked perfect."],"k":0,"w":"Fluency is not comprehension; it can produce polished text that misreads intent."},{"i":"D1.2-L1-c","c":"D1.2","l":1,"f":"c","cl":"I know AI can reflect gaps in what it was trained on.","s":"An AI gives great advice on a popular topic but is vague and wrong on a niche local one. Most likely reason?","o":["Since niche information is deliberately withheld, the model is blocked from learning it.","Because a model masters just one subject, it fails on everything else.","Since it favours well-known places, it neglects smaller local ones.","Because it saw far more data on common topics, rare ones are weaker."],"k":3,"w":"Coverage follows training data; thin data means weaker, less reliable answers."},{"i":"D1.2-L2-a","c":"D1.2","l":2,"f":"a","cl":"I can spot the fabricated part in an AI answer.","s":"AI: 'Chamomile is a calming herb and, per the 2019 Zurich Sleep Index, it cuts night waking by 40%.' Which part should you distrust most?","o":["Because calming herbs sound like marketing, that general claim is the least reliable.","Since botanical labels are often wrong, calling chamomile a herb is the doubtful part.","The named 2019 Zurich Sleep Index and its exact 40% figure are most suspect.","Because timing advice is just opinion, the evening-use suggestion is what to distrust."],"k":2,"w":"A specific named source plus an exact number is the most checkable and most likely invented element."},{"i":"D1.2-L2-b","c":"D1.2","l":2,"f":"b","cl":"I can tell an unverifiable claim from a checkable one.","s":"An AI recommends a cafe and adds that it 'won Best Espresso in the city in 2022'. What is the issue with that line?","o":["Since cafes are not eligible for awards, the whole claim is impossible.","Because espresso is only an ingredient, the award category makes no sense.","Since 2022 is very recent, the model cannot mention anything from that year.","Because a named award and year is a checkable external claim, you should verify it."],"k":3,"w":"Award-and-year claims are external facts to confirm, not to repeat on trust."},{"i":"D1.2-L2-c","c":"D1.2","l":2,"f":"c","cl":"I can notice when an answer quietly changes my question.","s":"You ask for the cheapest option; the AI enthusiastically describes the 'best' option instead. What happened?","o":["Since the cheapest option is always the best, the answer still fits your ask.","Because the model could not read your question, it answered a random one.","Since it addressed price and quality, it answered exactly what you asked.","Because it drifted from cheapest to best, a subtle switch, you should catch it."],"k":3,"w":"Answers can silently redefine the ask; noticing the swap is the skill."},{"i":"D1.2-L3-a","c":"D1.2","l":3,"f":"a","cl":"I can predict which tasks a text-only AI will struggle with.","s":"Which task is a text-only chatbot, with no internet or tools, most likely to get wrong?","o":["Since idioms are figurative, explaining a common one usually defeats the model.","Because word choice needs judgement, suggesting a synonym often goes wrong.","Since rewriting changes meaning, rewording your paragraph is where it fails most.","Because live prices change constantly, stating a stock's exact price now is unreliable."],"k":3,"w":"Live, changing data is what an offline text model cannot reliably supply."},{"i":"D1.2-L3-b","c":"D1.2","l":3,"f":"b","cl":"I can foresee counting and arithmetic slips before trusting them.","s":"You paste a long list and ask the AI for an exact item count and a column total. What should you plan to double-check?","o":["Since text errors are the main risk, only the spelling needs checking.","Because long precise counting is a known weak spot, verify the count and total.","Because appearance affects trust, only the font needs a second look.","Since computers count perfectly, the totals need no checking at all."],"k":1,"w":"Exact counting and arithmetic over long input is error-prone and worth verifying."},{"i":"D1.2-L3-c","c":"D1.2","l":3,"f":"c","cl":"I can anticipate when my own question biases the answer.","s":"You ask 'Why is option X the best?' and the AI lists only reasons for X. What subtle failure is at work?","o":["Because the question is leading, it defends X and skips the downsides.","Since the model is always correct, its one-sided answer must be complete.","Because the AI endorsed X, that agreement proves X is genuinely best.","Since the model gave no real answer, it must have refused the task."],"k":0,"w":"Leading prompts steer the output; a neutral question surfaces trade-offs."},{"i":"D1.2-L4-a","c":"D1.2","l":4,"f":"a","cl":"I can build a check that targets AI's most likely error.","s":"You set up AI to draft messages containing dates and names. Which single check catches its most likely error?","o":["Because specifics are the main risk, verify every name, date and figure first.","Since more detail reads as thorough, making the message longer reduces its errors.","Because a warmer greeting sets the tone, adjusting it addresses the main error.","Since the draft reads smoothly, its fluency shows the facts are correct."],"k":0,"w":"Fabricated specifics are the main risk; a targeted fact check catches them."},{"i":"D1.2-L4-b","c":"D1.2","l":4,"f":"b","cl":"I can design a workflow that resists fabricated sources.","s":"To stop AI summaries citing sources that do not exist, which design choice helps most?","o":["Since higher creativity yields richer answers, raising that setting improves its citations.","Because a polite request sets expectations, asking it to be honest prevents fabrication.","Since instructions confuse the model, removing them all stops invented sources.","Because openable links are checkable, require them and flag any it cannot provide."],"k":3,"w":"Openable-link requirements plus flagging structurally block invented citations."},{"i":"D1.2-L4-c","c":"D1.2","l":4,"f":"c","cl":"I can decide when a task is too risky to let AI run unchecked.","s":"For which task should you NOT let AI act automatically without a human check?","o":["Since wording can offend, a birthday message must never be automated.","Because a wrong name causes confusion, folder naming needs manual approval.","Because money moves are irreversible, refunds or payments need a human check.","Since taste is personal, a playlist suggestion should never run automatically."],"k":2,"w":"Irreversible, high-impact actions need a human gate; trivial ones do not."},{"i":"D1.3-L1-a","c":"D1.3","l":1,"f":"a","cl":"I can find and manage a file I saved.","s":"You saved a file but cannot find it. Which approach is reliable rather than luck?","o":["Since reinstalling refreshes the app, it will bring the missing file back.","Because the connection may be dropping files, restarting the router restores it.","Because the file still exists, search its name or check Downloads and recents.","Since the device is failing, a new one is the reliable fix."],"k":2,"w":"Name search and the recent/Downloads list find files directly; the rest are unrelated."},{"i":"D1.3-L1-b","c":"D1.3","l":1,"f":"b","cl":"I can recover access to an account sensibly.","s":"A login says your password is wrong although you are sure it is right. Best first move?","o":["Since the old login fails, creating a fresh account each time solves it.","Because a human can override logins, emailing the company's head fixes it.","Since the app rejects you, deleting it permanently is the sensible response.","Because small input slips are common, check Caps Lock, then use forgot password."],"k":3,"w":"Simple input checks plus the reset flow solve most logins."},{"i":"D1.3-L1-c","c":"D1.3","l":1,"f":"c","cl":"I can tell a safe online prompt from a risky one.","s":"A pop-up shouts 'Your device is infected! Click to fix now.' Digitally-literate response?","o":["Since the pop-up offers help, calling its number will get the problem fixed.","Because genuine warnings never demand a panic click, ignore or close the pop-up.","Because the threat sounds urgent, clicking immediately is the safest quick action.","Since a paid fix sounds thorough, entering your card clears the infection."],"k":1,"w":"Scare pop-ups are a scam pattern; genuine protections do not demand a panic click or payment."},{"i":"D1.3-L2-a","c":"D1.3","l":2,"f":"a","cl":"I can keep files in sync across devices.","s":"You want the same up-to-date document on phone and laptop without emailing it around. Best approach?","o":["Since screenshots capture the content, saving one per page keeps both devices current.","Because emailing sends the latest version, resending after each edit keeps them matched.","Since a printout is always available, printing after each change keeps it updated.","Because a synced cloud folder holds one live copy, both devices open the same file."],"k":3,"w":"A synced folder holds one live copy across devices."},{"i":"D1.3-L2-b","c":"D1.3","l":2,"f":"b","cl":"I can control an app's permissions.","s":"An app keeps using your location in the background and you want that to stop. Where do you fix it?","o":["Since reviews influence the developer, changing your rating stops the tracking.","Because per-app permissions control access, fix it in that app's settings.","Because a dark screen halts activity, turning it off stops background location.","Since the app requires location, this access can never be switched off."],"k":1,"w":"Per-app permissions in settings govern location access."},{"i":"D1.3-L2-c","c":"D1.3","l":2,"f":"c","cl":"I can weigh a convenience against a privacy trade.","s":"A simple free game asks for access to your contacts, photos and microphone to play. Sensible read?","o":["Since full access avoids errors, granting everything lets the game run smoothly.","Because access should match need, question the request and deny what is unnecessary.","Because the game asks for them, these permissions must all be required to play.","Since apps compete for access, removing others frees the permissions this game needs."],"k":1,"w":"Access should match need; over-broad requests are a red flag."},{"i":"D1.3-L3-a","c":"D1.3","l":3,"f":"a","cl":"I can troubleshoot by isolating the cause.","s":"A video call freezes on your phone but not your laptop, on the same wifi. Best first diagnostic?","o":["Since the call drops, faulty headphones are the likely cause to replace.","Because only the phone fails, reset its connection before anything wider.","Because both share the network, reinstalling the laptop's system will fix the phone.","Since the router serves both, replacing it resolves the phone's freezing."],"k":1,"w":"Only the phone fails, so the fault is local to it; isolate before broad fixes."},{"i":"D1.3-L3-b","c":"D1.3","l":3,"f":"b","cl":"I can fix an app problem in a sensible order.","s":"One app crashes whenever you open it. Which order of fixes is most sensible?","o":["Because light fixes come first, force-close and reopen, then update or reinstall.","Since one reset clears all faults, factory-resetting the device first is most efficient.","Because the app fails repeatedly, the device itself is broken and worth discarding.","Since crashes suggest a breach, changing your email password stops the problem."],"k":0,"w":"Try light, targeted steps before drastic ones."},{"i":"D1.3-L3-c","c":"D1.3","l":3,"f":"c","cl":"I can spot when a fix is targeted rather than random.","s":"Photos will not save because storage is full. Which is the targeted fix?","o":["Because storage is full, free space by removing or offloading large unused files.","Since defaults tidy the system, resetting all settings clears the full storage.","Because heavy images fill storage, changing the wallpaper frees enough room to save.","Since uploads use storage, turning off wifi stops it filling and lets saving resume."],"k":0,"w":"The cause is storage, so the fix addresses storage directly."},{"i":"D1.3-L4-a","c":"D1.3","l":4,"f":"a","cl":"I can set up shared access for others safely.","s":"You set up a shared folder for a group. Which choice gives access without over-exposing you?","o":["Because access should be scoped, grant each person permission to that folder only.","Since your laptop stays private, keeping it there gives the group safe access.","Because a public link is easy to share, posting it gives the group access.","Since they need to get in, sharing your account password lets them reach it."],"k":0,"w":"Folder-level permissions grant access without exposing the account."},{"i":"D1.3-L4-b","c":"D1.3","l":4,"f":"b","cl":"I can configure a device so a less-confident person copes alone.","s":"Setting up a tablet for an older relative to video-call, which setup helps most?","o":["Since night use tires the eyes, disabling the screen at night aids calling.","Because daily removal preserves the battery, taking it out each day helps reliability.","Because ease matters, set large text, a one-tap call shortcut and automatic updates.","Since fewer icons mean less confusion, hiding every app makes calling easier."],"k":2,"w":"Readability, a simple path and auto-updates enable independent use."},{"i":"D1.3-L4-c","c":"D1.3","l":4,"f":"c","cl":"I can design a backup habit that survives a lost device.","s":"You want family photos to survive a lost or broken phone. Strongest simple setup?","o":["Since prints last for years, printing them and deleting the files keeps them safe.","Because a second automatic copy survives loss, back up to a cloud or drive.","Because an emailed copy sits elsewhere, sending one to anyone preserves your photos.","Since the phone is always with you, keeping the sole copy there is enough."],"k":1,"w":"A second, automatic copy is what survives device loss."},{"i":"D1.4-L1-a","c":"D1.4","l":1,"f":"a","cl":"I treat AI as a tool, not an authority.","s":"An AI gives money advice that clashes with what you know about your own situation. Healthiest stance?","o":["Since the model weighed more data, its advice outranks your own knowledge.","Because AI only informs, treat it as one input and let your judgement lead.","Because money is sensitive, AI should never inform any financial choice.","Since a guarantee reassures you, asking it to promise makes the advice trustworthy."],"k":1,"w":"AI informs; your judgement leads on your own circumstances."},{"i":"D1.4-L1-b","c":"D1.4","l":1,"f":"b","cl":"I know the responsibility for a choice stays with me.","s":"You act on an AI suggestion and it goes wrong. Who is accountable?","o":["Because you chose to act on it, the accountability is yours.","Since the AI produced the advice, responsibility for the outcome rests with it.","Because a machine was involved, no person can be held accountable here.","Since they built the tool, the device maker is always accountable for results."],"k":0,"w":"Accountability rests with the person who acts, not the tool."},{"i":"D1.4-L1-c","c":"D1.4","l":1,"f":"c","cl":"I can notice when AI is quietly replacing my own thinking.","s":"Which habit is the early warning sign of leaning on AI too much?","o":["Since you still weigh its output, checking answers against your reasoning shows over-reliance.","Because you lean on its explanations, asking it to justify itself signals dependence.","Because understanding fades quietly, accepting answers you no longer try to grasp is the sign.","Since AI starts your thinking, brainstorming with it before deciding marks over-reliance."],"k":2,"w":"Losing your own understanding is the warning sign; the others keep you engaged."},{"i":"D1.4-L2-a","c":"D1.4","l":2,"f":"a","cl":"I keep my own voice and judgement in AI-assisted work.","s":"AI drafts a heartfelt message to a friend. Before sending, the human-centred move is?","o":["Since AI wrote part of it, an AI-touched message should never be sent.","Because the draft looks complete, sending it unread saves time and works fine.","Since extra content feels richer, adding more AI text makes it more heartfelt.","Because it must be true and yours, read it and adjust anything off."],"k":3,"w":"Reviewing and personalising keeps it truthful and yours."},{"i":"D1.4-L2-b","c":"D1.4","l":2,"f":"b","cl":"I check AI output against what I already know.","s":"AI gives directions to a place you know well, but they look wrong. You?","o":["Because you know the area, trust that knowledge and cross-check the route.","Since the directions seem wrong, cancelling the trip is the safest response.","Because the model erred, asking it to apologise will correct the directions.","Since the AI is objective, following its route despite your doubt is wiser."],"k":0,"w":"Reliable personal knowledge should override a doubtful output."},{"i":"D1.4-L2-c","c":"D1.4","l":2,"f":"c","cl":"I can resist an answer just because it is convenient.","s":"AI gives an answer you like that saves effort, but you have a small nagging doubt. Best response?","o":["Because convenience is not correctness, check the doubt before relying on it.","Since easy answers mislead, no convenient answer should ever be trusted.","Because it saves effort and fits, a convenient answer can be assumed correct.","Since it spares you work, accepting the answer for its convenience is reasonable."],"k":0,"w":"Convenience is not correctness; resolve the doubt before acting."},{"i":"D1.4-L3-a","c":"D1.4","l":3,"f":"a","cl":"I can balance speed against accountability.","s":"AI could auto-approve small refunds for your side-shop, saving time. Responsible setup?","o":["Because risk scales with size, auto-handle small refunds and route larger ones to you.","Since automation saves time, approving every refund without a limit is efficient.","Because the system is trusted, none of the refunds need any human review.","Since refunds carry risk, rejecting them all keeps the shop safest."],"k":0,"w":"A capped auto path with human handling of exceptions keeps both speed and accountability."},{"i":"D1.4-L3-b","c":"D1.4","l":3,"f":"b","cl":"I decide when to defer to AI and when to override it.","s":"When is overriding an AI recommendation most clearly justified?","o":["Because verifiable conflict matters, override it when facts or your values disagree.","Since following advice takes effort, overriding it whenever easier is justified.","Because judgement varies by day, overriding it is only justified on weekends.","Since the model is objective, overriding its recommendation is never justified."],"k":0,"w":"Verifiable conflict or value mismatch justifies overriding."},{"i":"D1.4-L3-c","c":"D1.4","l":3,"f":"c","cl":"I can tell high-stakes decisions from low-stakes ones for AI use.","s":"For which decision should AI stay strictly an assistant, never the decider?","o":["Since taste matters, choosing tonight's recipe must stay a human decision.","Because it affects a person's livelihood, a loan or job decision needs a human decider.","Because names carry meaning, deciding a document's title should never be automated.","Since mood is personal, selecting the playlist must remain a human choice."],"k":1,"w":"Decisions that seriously affect people need a human decider."},{"i":"D1.4-L4-a","c":"D1.4","l":4,"f":"a","cl":"I can champion human-centred use in a group's norms.","s":"Setting one AI-use norm for a volunteer group, strongest opening principle?","o":["Since disclosure invites doubt, the group should never admit that AI was used.","Because debate slows work, no questions about AI use should be permitted.","Since the model is impartial, letting AI make the final calls is fairest.","Because accountability anchors trust, AI assists while a named person owns the outcome."],"k":3,"w":"Named human accountability is the core of a human-centred norm."},{"i":"D1.4-L4-b","c":"D1.4","l":4,"f":"b","cl":"I can help others keep their judgement in the loop.","s":"A friend forwards AI answers as fact without checking. Most human-centred help?","o":["Because habits build judgement, show them a quick verify-before-share routine and its value.","Since the tool misled them, telling them AI is useless will stop the sharing.","Because spreading errors is harmful, reporting your friend somewhere is the responsible move.","Since it is their choice, doing nothing respects them and avoids conflict."],"k":0,"w":"Coaching a light verification habit builds their judgement."},{"i":"D1.4-L4-c","c":"D1.4","l":4,"f":"c","cl":"I can spot when 'efficiency' is hiding a loss of accountability.","s":"A group wants to fully automate a decision about its members 'to save time'. Human-centred concern?","o":["Since machines lack empathy, automating any decision about people is always wrong.","Because speed serves everyone, there is no concern; faster decisions are always better.","Because full automation removes a decider, no one would answer for the outcome.","Since people value patience, members would happily accept the slower manual process instead."],"k":2,"w":"Full automation of decisions about people can erase accountability, which is the real risk."},{"i":"D2.1-L1-a","c":"D2.1","l":1,"f":"a","cl":"I can ask a clear, answerable question.","s":"Which request gives the AI enough to actually help with dinner?","o":["I have had such a long week and I do not know what to eat.","Suggest 3 quick dinners I can make with chicken and rice.","Suggest meals i can eat for one person","I'm hungy can you help me out here?"],"k":1,"w":"A specific, scoped ask is answerable; vague or rambling text gives the AI nothing to act on."},{"i":"D2.1-L1-b","c":"D2.1","l":1,"f":"b","cl":"I can tell a clear prompt from a vague one.","s":"Two prompts want the same thing. Which is actually the clearer one?","o":["I urgently need to save money tell me how.","Some help with money stuff please, thank you so much.","Tell me everything about money.","Explain simply how a savings buffer works and roughly how much a beginner might aim for."],"k":3,"w":"Clarity comes from a specific topic and ask; politeness and urgency do not make a vague prompt clear."},{"i":"D2.1-L1-c","c":"D2.1","l":1,"f":"c","cl":"I know a polite or longer prompt is not automatically a better prompt.","s":"A friend thinks adding 'please, kind AI, if you would be so lovely' gets better answers. Best guidance?","o":["What helps most is being clear and specific, not flattery","Since courtesy earns effort, polite wording makes the AI try harder.","Because more words add detail, a longer prompt always gets a better answer.","Since capitals add emphasis, writing in capital letters forces stronger answers."],"k":0,"w":"Quality tracks clarity and specificity, not manners, length or capitals."},{"i":"D2.1-L2-a","c":"D2.1","l":2,"f":"a","cl":"I can isolate the precise context an AI requires to generate highly relevant and useful outputs.","s":"When requesting a tailored travel inventory, which phrasing provides the model with the necessary parameters?","o":["What should I bring on my trip?","A packing list, though I should mention I love blue and have a cat.","Just a packing list, please.","Packing list for a 3-day winter city trip, carry-on only, one adult"],"k":3,"w":"Useful context is relevant constraints (length, season, luggage); colour and pets are noise."},{"i":"D2.1-L2-b","c":"D2.1","l":2,"f":"b","cl":"I can articulate a specific goal so the resulting AI response aligns perfectly with its intended purpose.","s":"If you require practical academic strategies tailored specifically for brief night sessions, which prompt provides the necessary direction?","o":["Any study tips at all?","List every study tip there is.","Just give me some study tips.","Give me 5 study tips for short evening sessions when I struggle to focus"],"k":3,"w":"Stating the purpose and constraint fits the answer to the need; 'every tip' ignores the purpose."},{"i":"D2.1-L2-c","c":"D2.1","l":2,"f":"c","cl":"I can tell relevant context from noise.","s":"Which detail actually helps the AI recommend a workout, rather than padding the prompt?","o":["The weather outside is rainy today.","I have 20 minutes a day, no equipment, and a knee to protect","My neighbour happens to exercise as well.","My favourite colour is green."],"k":1,"w":"Constraints that shape the plan are signal; unrelated facts are noise."},{"i":"D2.1-L3-a","c":"D2.1","l":3,"f":"a","cl":"I can structure a prompt with role, context and output format.","s":"Which prompt is best structured for a reliable, reusable result?","o":["Act as a budgeting coach. From the income and costs below, return a table of categories, amounts and one savings tip.","Write something about budgeting.","Give me budgeting, and make it really good, detailed and long.","Give me budgeting in the best possible way ever."],"k":0,"w":"Role, context and an explicit output format make results reliable; vague quality words do not."},{"i":"D2.1-L3-b","c":"D2.1","l":3,"f":"b","cl":"I can give an example to steer the format I want.","s":"You want the AI to reformat messy notes consistently. What most reliably gets the format you want?","o":["Repeat the word 'format' several times so the instruction sticks.","Show it one example of the exact layout you want, then ask it to match that","Just tell it to use good formatting and trust it to comply.","Ask it to format nicely and hope the layout matches."],"k":1,"w":"One clear example anchors the format far better than vague adjectives or repetition."},{"i":"D2.1-L3-c","c":"D2.1","l":3,"f":"c","cl":"I can break a big task into steps instead of one giant ask.","s":"You want AI to research a topic, then summarise it, then draft a post. Best approach?","o":["Do it in steps: gather, then summarise, then draft, checking each stage","Ask for all three at once in a single vague sentence.","Just tell it to do everything perfectly in one go.","Send the same one-line prompt three times and combine the results."],"k":0,"w":"Chaining steps with checks handles complex work better than one lumped request."},{"i":"D2.1-L4-a","c":"D2.1","l":4,"f":"a","cl":"I can design a prompt template others can reuse.","s":"You are turning a prompt that worked into a template for others. What makes it reusable?","o":["Hard-code your own details so it always returns your personal answer.","Replace the parts that change with clear placeholders and a note on how to fill them","Strip out all instructions so the template stays fully flexible.","Make it as long as possible so it covers every situation."],"k":1,"w":"Placeholders plus guidance make a template reusable; stripping instructions removes what makes it work."},{"i":"D2.1-L4-b","c":"D2.1","l":4,"f":"b","cl":"I can write a standing instruction that sets behaviour once.","s":"You want an AI to always reply in a warm, short tone for your project, without repeating that each time. Best move?","o":["Retype 'be warm and short' at the start of every message.","Set it once as a saved standing instruction the AI follows by default","Simply trust the AI to remember your tone on its own.","Add exclamation marks so the tone comes across as warm."],"k":1,"w":"A saved system instruction sets default behaviour once, rather than per message."},{"i":"D2.1-L4-c","c":"D2.1","l":4,"f":"c","cl":"I can teach a repeatable prompting pattern, not just give one answer.","s":"A friend keeps getting weak AI results. Which help builds their skill rather than solving it once?","o":["Hand them a longer prompt without explaining how it works.","Just tell them AI is unreliable and leave it there.","Show them the pattern: role, context, format, then refine, and when to use it","Type the perfect prompt yourself and hand it straight to them."],"k":2,"w":"Teaching the repeatable pattern grows their capability beyond a single answer."},{"i":"D2.2-L1-a","c":"D2.2","l":1,"f":"a","cl":"I know the first answer is a starting point, not the final word.","s":"The AI's first answer is vague. What is the healthiest view of it?","o":["Because persistence pays, retyping the same prompt will eventually fix it.","It is a first draft you can improve by asking again with detail","Since the first try was vague, the AI clearly cannot help here.","Because this is its best effort, you should simply accept the answer."],"k":1,"w":"Treat the first answer as a draft to refine; resending the same words changes little."},{"i":"D2.2-L1-b","c":"D2.2","l":1,"f":"b","cl":"I know a specific follow-up beats starting over.","s":"An AI recipe is missing the quantities. Simplest good move?","o":["Give up and just cook something else instead.","Ask it to add exact amounts and steps","Start a brand new chat and rebuild the request.","Cook it anyway while guessing the missing amounts."],"k":1,"w":"A targeted follow-up fixes the gap without discarding a good draft."},{"i":"D2.2-L1-c","c":"D2.2","l":1,"f":"c","cl":"I can tell a useless retry from a useful one.","s":"Which action is most likely to actually improve a weak answer?","o":["Adding 'please' and resending the same request.","Sending the identical prompt again, unchanged.","Closing the app and reopening it fresh.","Saying what was missing and asking again"],"k":3,"w":"Naming the gap gives the model something to fix; identical or polite resends do not."},{"i":"D2.2-L2-a","c":"D2.2","l":2,"f":"a","cl":"I re-ask with the missing detail rather than vaguely.","s":"AI gave a generic workout plan. Best refinement?","o":["Send the exact same request again, unchanged.","Ask the AI why its first answer was bad.","Add your goal, time per day and any injury, then ask again","Just send 'make it better' and wait."],"k":2,"w":"Supplying the missing constraints directs a real improvement; 'make it better' is too vague."},{"i":"D2.2-L2-b","c":"D2.2","l":2,"f":"b","cl":"I can steer tone or format on a second pass.","s":"A drafted message is too formal for a close friend. Best refine?","o":["Rewrite the whole message yourself and discard the draft.","Add more formal wording to try to fix it.","Send it as it is, since tone hardly matters.","Ask for a warmer, shorter, casual version"],"k":3,"w":"A targeted tone instruction fixes it fast and in the right direction."},{"i":"D2.2-L2-c","c":"D2.2","l":2,"f":"c","cl":"I can deliver precise, actionable feedback that explicitly directs the AI on how to refine its output.","s":"When adjusting an initial AI generation, which feedback style is most effective for improving the subsequent response?","o":["'Try harder next time.'","'Just do it again.'","'This is simply wrong.'","'Good, but it missed my budget and is too long; keep it under 5 points.'"],"k":3,"w":"Specific, actionable feedback tells the model exactly what to change."},{"i":"D2.2-L3-a","c":"D2.2","l":3,"f":"a","cl":"I iterate by changing one thing at a time.","s":"A cover message is close but flat. Which is systematic iteration, not guesswork?","o":["Change everything at once on each attempt.","Name the weak spots, fix one at a time, and compare versions","Ask for ten versions and pick one at random.","Regenerate it entirely and hope the next is better."],"k":1,"w":"Isolating one change and comparing is what makes iteration systematic."},{"i":"D2.2-L3-b","c":"D2.2","l":3,"f":"b","cl":"I refine against clear criteria, not a vibe.","s":"How do you turn 'make it better' into an actionable iteration?","o":["Judging it against set criteria: accurate, on-tone, complete, right length","Making the prompt longer on each round.","Asking for it to be more clear.","Trusting whichever version feels more plausible."],"k":0,"w":"Explicit criteria give iteration a target; vague wishes do not."},{"i":"D2.2-L3-c","c":"D2.2","l":3,"f":"c","cl":"I can tell real improvement from just 'different'.","s":"After three rewrites the answer keeps missing the same key point. Best structured fix?","o":["Accept whichever version turns out longest.","State exactly what must be included and ask it to check its draft against that list","Switch to a completely different tool instead.","Rewrite it a fourth time in the same way."],"k":1,"w":"An explicit requirement plus a self-check closes a persistent gap."},{"i":"D2.2-L4-a","c":"D2.2","l":4,"f":"a","cl":"I can teach a repeatable refine-loop.","s":"You show someone how to reliably get better AI results. Best pattern to teach?","o":["'State the goal, critique the draft on set criteria, fix one point at a time.'","'Always accept the first answer.'","'Type more words until it looks good.'","'Use the longest prompt you can.'"],"k":0,"w":"A clear, repeatable loop is teachable and works."},{"i":"D2.2-L4-b","c":"D2.2","l":4,"f":"b","cl":"I can give a reusable quality checklist.","s":"Best checklist to hand someone for refining any AI answer?","o":["'Did it answer fast?'","'Does it sound confident?'","'Is it accurate, on-tone, complete, and the right length?'","'Is it long enough?'"],"k":2,"w":"Concrete quality criteria beat proxies like length, speed or confident tone."},{"i":"D2.2-L4-c","c":"D2.2","l":4,"f":"c","cl":"I coach the method instead of handing over the answer.","s":"A colleague keeps asking you to fix their AI outputs. Most useful long-term help?","o":["Give them your finished version without any explanation.","Simply tell them to stop using AI.","Teach them the critique-and-refine method so they can do it themselves","Keep fixing every output for them yourself."],"k":2,"w":"Coaching the method builds their independence; fixing it for them does not."},{"i":"D2.3-L1-a","c":"D2.3","l":1,"f":"a","cl":"I know an AI answer should be read critically before acting.","s":"When acting on an AI's advice, what is the best first habit to adopt?","o":["Assume it is perfect because it looks detailed.","Ignore it entirely just to be safe.","Copy it straight out and use it immediately.","Read it and ask whether it actually makes sense before using it"],"k":3,"w":"A quick sense-check before acting is the aware habit; detail is not proof."},{"i":"D2.3-L1-b","c":"D2.3","l":1,"f":"b","cl":"I can recognise a warning sign that an answer needs checking.","s":"Which of these is the real reason to double-check an AI answer?","o":["Because the tone was friendly, the answer needs a second look.","It makes a strong specific claim you cannot find anywhere else","Since it replied very quickly, the answer is worth double-checking.","Because it uses full polite sentences, it should be checked carefully."],"k":1,"w":"An unverifiable specific claim is the warning sign; style, speed and tone are not."},{"i":"D2.3-L1-c","c":"D2.3","l":1,"f":"c","cl":"I know a confident tone is not proof of a correct answer.","s":"An AI answer sounds very sure. What does that certainty actually tell you?","o":["Nothing about accuracy; confidence and correctness are separate","Because it sounds sure, no further checking is needed.","Since it is confident, it must have checked reliable sources.","Because it states it firmly, the answer is therefore correct."],"k":0,"w":"Confidence is a style of writing, not evidence of truth."},{"i":"D2.3-L2-a","c":"D2.3","l":2,"f":"a","cl":"I sanity-check the important detail before I rely on it.","s":"AI lists a shop's opening hours for a trip you are about to make. Sensible check?","o":["Just drive over and hope they are open.","Ask the AI to promise the hours are correct.","Assume they are right because they look specific.","Confirm the hours on the shop's own page first"],"k":3,"w":"Checking the primary source avoids a wasted trip; asking the AI to promise proves nothing."},{"i":"D2.3-L2-b","c":"D2.3","l":2,"f":"b","cl":"I can do a quick plausibility check on a number.","s":"AI says your morning walk burned 4,000 calories. Best reaction?","o":["Because the number is precise, assume the tracker is simply impressive.","To stay safe, double the figure before trusting it.","That is implausibly high for a walk; treat the figure as wrong","Since the app reported it, accept the figure and eat accordingly."],"k":2,"w":"A sense-check on magnitude catches an obviously off figure."},{"i":"D2.3-L2-c","c":"D2.3","l":2,"f":"c","cl":"I check the risky claim harder than the trivial one.","s":"An AI answer mixes a harmless tip with a medicine dosage. Which deserves the real check?","o":["Because both seem reasonable, neither claim needs any checking.","Since fairness matters, check both claims equally, word for word.","Because the tip came first, that harmless one deserves the real check.","The dosage, because getting that wrong actually matters"],"k":3,"w":"Effort should follow risk; the high-stakes claim gets the real check."},{"i":"D2.3-L3-a","c":"D2.3","l":3,"f":"a","cl":"I trace an important claim to its original source.","s":"AI cites a statistic you plan to share publicly. Strongest check?","o":["Find the original source of the statistic and confirm the number","Share it as it stands, since it looks specific.","Ask the same AI whether it is sure.","Round the figure so it looks tidy."],"k":0,"w":"Tracing to the origin confirms it; asking the same tool is not independent."},{"i":"D2.3-L3-b","c":"D2.3","l":3,"f":"b","cl":"I use an independent source, not the same tool again.","s":"Which counts as genuinely cross-checking an AI claim?","o":["Comparing it against an independent, trustworthy source","Asking the same AI to confirm its own answer.","Checking the grammar of the response.","Reading the AI's answer through twice."],"k":0,"w":"Cross-checking needs an independent source, not repetition."},{"i":"D2.3-L3-c","c":"D2.3","l":3,"f":"c","cl":"I go to the authority for a claim that affects me.","s":"AI states a benefit deadline that affects your money. Best verification?","o":["Ask a friend to guess the deadline.","Check the official body's own website for the date","Simply rely on the AI's stated date.","Assume deadlines like this rarely change anyway."],"k":1,"w":"High-stakes dates should be confirmed at the authoritative source."},{"i":"D2.3-L4-a","c":"D2.3","l":4,"f":"a","cl":"I build a fixed verification step into a routine.","s":"You post AI-drafted facts publicly on a schedule. Best built-in safeguard?","o":["Trust the draft whenever it reads smoothly.","A fixed step to verify names, dates and figures against a source before posting","Run only a spellcheck before posting.","Post first and check only if someone complains."],"k":1,"w":"A standing verification step catches factual errors before they go out."},{"i":"D2.3-L4-b","c":"D2.3","l":4,"f":"b","cl":"I design the workflow so unverifiable claims get flagged.","s":"Setting up AI research summaries for others, strongest design element?","o":["Accept the first summary without review.","Leave out sources altogether for simplicity.","Prefer whichever summary sounds most confident.","For each key point, require an openable source and flag anything unlinkable"],"k":3,"w":"Requiring openable sources and flagging the rest limits fabricated claims."},{"i":"D2.3-L4-c","c":"D2.3","l":4,"f":"c","cl":"I decide up front what must be checked and what can pass.","s":"What makes an evaluation step efficient rather than exhausting?","o":["Checking nothing at all to d for a shared task. Best move?","o":["Use it anyway and say nothing.","Check whether it is approved before using it","Ask a random stranger online about it.","Assume it is banned forever and give up."],"k":1,"w":"Check approval before use when unsure."},{"i":"D3.3-L2-a","c":"D3.3","l":2,"f":"a","cl":"I confirm a tool is cleared before putting real data in.","s":"Before putting group data into a new tool, sensible check?","o":["Assume all tools are fine by default.","Ask the tool itself whether it is approved.","Skip the check to save time.","Confirm it is on the approved list or cleared first"],"k":3,"w":"Confirm status before real data goes in; asking the tool proves nothing."},{"i":"D3.3-L2-b","c":"D3.3","l":2,"f":"b","cl":"I pause on a handy but unvetted suggestion.","s":"A colleague suggests a handy but unvetted tool for shared data. You?","o":["Check its approval status before using real data","Use it immediately with the real data.","Try it first with the most sensitive data.","Refuse to ever use any tools again."],"k":0,"w":"Vet before trusting shared data to it."},{"i":"D3.3-L2-c","c":"D3.3","l":2,"f":"c","cl":"I know what actually counts as 'this tool is ok'.","s":"Best evidence a tool is okay for a shared task?","o":["A friend happens to like it.","It is on the approved list or has been cleared","It runs lots of ads, so it seems legitimate.","It looks modern and popular."],"k":1,"w":"Approval or clearance is the evidence that counts, not popularity or ads."},{"i":"D3.3-L3-a","c":"D3.3","l":3,"f":"a","cl":"I understand what approval is really protecting.","s":"Main reason approval matters for AI tools handling shared data?","o":["The tool's colour scheme.","Only its download speed.","How many times it has been downloaded.","Where the data goes, how it is used, and the licensing terms"],"k":3,"w":"Data flow, usage and licensing are the substance of approval."},{"i":"D3.3-L3-b","c":"D3.3","l":3,"f":"b","cl":"I can name the main risk of an unapproved tool.","s":"Which risk does using an unapproved tool most raise?","o":["There is no real risk at all.","It only makes typing slightly slower.","Sensitive data leaving safe hands or breaching terms","It merely makes the screen brighter."],"k":2,"w":"Data exposure and term breaches are the core risks."},{"i":"D3.3-L3-c","c":"D3.3","l":3,"f":"c","cl":"I know 'free and popular' is not the same as 'cleared'.","s":"A tool is free and widely used but unvetted for private data. Sound judgement?","o":["Because it is popular, it must already be approved.","Try it first on the most sensitive data.","Because it is free, it must be safe.","Free and popular do not mean cleared; check its data handling first"],"k":3,"w":"Cost and popularity are not clearance for private data."},{"i":"D3.3-L4-a","c":"D3.3","l":4,"f":"a","cl":"I can help set the criteria for which tools are okay.","s":"Helping a club decide on approved AI tools, strongest criterion?","o":["The most features, regardless of privacy.","Clear data handling, reliability, and fit for the group's tasks","Only ever the cheapest option.","Whatever happens to be trending this month."],"k":1,"w":"Data handling, reliability and fit lead the decision."},{"i":"D3.3-L4-b","c":"D3.3","l":4,"f":"b","cl":"I keep an approved-tool list current.","s":"What keeps an approved-tool list useful over time?","o":["Never reviewing the list once it is made.","Reviewing it as tools and needs change","Adding every tool that exists to it.","Keeping the list secret from the group."],"k":1,"w":"Periodic review keeps the list current and trusted."},{"i":"D3.3-L4-c","c":"D3.3","l":4,"f":"c","cl":"I use a clear process when someone requests a new tool.","s":"Someone wants a tool added to the approved list. Best process?","o":["Check its data handling and fit, then decide","Add it with no checks at all.","Decide it by a simple coin flip.","Refuse all such requests automatically."],"k":0,"w":"Assess against clear criteria before adding."},{"i":"D4.1-L1-a","c":"D4.1","l":1,"f":"a","cl":"I can read what a trend line is showing.","s":"A line on your savings chart climbs steadily from January to June. It shows?","o":["Savings fell steadily over those months.","The chart must be broken.","Nothing can be read from it.","Savings rose over those months"],"k":3,"w":"A rising line means the value increased over the period."},{"i":"D4.1-L1-b","c":"D4.1","l":1,"f":"b","cl":"I can read a proportion from a chart.","s":"A pie chart shows 'housing 50%'. That means housing is?","o":["Half of the total spending shown","Housing costs exactly 50 euros.","It is impossible to tell what that means.","Housing is only a tiny slice of spending."],"k":0,"w":"50% is half the total, not an absolute amount."},{"i":"D4.1-L1-c","c":"D4.1","l":1,"f":"c","cl":"I can compare two bars sensibly.","s":"March's bar is twice as tall as February's on a spending chart. Sensible read?","o":["Spending was the same in both months.","March had no spending at all.","March spending was about double February's","March spending was about half February's."],"k":2,"w":"Twice the height means roughly double the value."},{"i":"D4.1-L2-a","c":"D4.1","l":2,"f":"a","cl":"I can read where two lines cross.","s":"On a chart of income vs spending, the two lines cross in April. That point means?","o":["Income and spending were equal that month","The lines touching is just a coincidence.","It means income vanished that month.","The chart simply failed in April."],"k":0,"w":"An intersection is where the two series are equal."},{"i":"D4.1-L2-b","c":"D4.1","l":2,"f":"b","cl":"I can spot a misleading axis.","s":"A bar chart's vertical axis starts at 90, not 0, so bars look wildly different. Careful read?","o":["The cut axis exaggerates small differences; check the real numbers","Because axes are neutral, they never affect how a chart looks.","Just ignore the numbers entirely.","The differences are exactly as huge as they look."],"k":0,"w":"A non-zero baseline visually magnifies small gaps."},{"i":"D4.1-L2-c","c":"D4.1","l":2,"f":"c","cl":"I can tell a temporary dip from a real decline.","s":"A steady trend dips for one month, then returns to normal. Best interpretation?","o":["The measurement must have stopped that month.","A permanent collapse has clearly begun.","The data must be fake.","A temporary dip within an overall steady pattern"],"k":3,"w":"A single dip that recovers is a fluctuation, not a collapse."},{"i":"D4.1-L3-a","c":"D4.1","l":3,"f":"a","cl":"I question an outlier instead of ignoring it.","s":"Your monthly spend is steady except one huge spike. Best first move?","o":["Assume every month is a spike like this.","Just delete the odd data point.","Ask what happened that month to cause it","Simply ignore the spike."],"k":2,"w":"Investigating the outlier's cause is the analytic move."},{"i":"D4.1-L3-b","c":"D4.1","l":3,"f":"b","cl":"I look at the spread, not just the average.","s":"The weekly average looks fine, but one week was extreme. Sound analysis?","o":["Drop the extreme week without asking why.","Look at the spread, since the average can hide extremes","Assume there is no variation at all.","Trust the average on its own."],"k":1,"w":"Looking at spread reveals what an average conceals."},{"i":"D4.1-L3-c","c":"D4.1","l":3,"f":"c","cl":"I do not assume two things rising together means one caused the other.","s":"Ice-cream sales and sunburns both rise in summer. Careful conclusion?","o":["The data itself must be wrong.","Sunburn must cause ice-cream sales.","Ice cream must cause sunburn.","Both rise with a third factor like hot weather; moving together is not proof of cause"],"k":3,"w":"Correlation is not causation; a shared cause can drive both."},{"i":"D4.1-L4-a","c":"D4.1","l":4,"f":"a","cl":"I present figures honestly so others can act on them.","s":"You share a budget summary others will act on. Best practice?","o":["Hide the assumptions behind it.","Show the figures, their source and the time period clearly","Show only the number that supports your point.","Use a cut axis to make it look dramatic."],"k":1,"w":"Transparent figures, source and period make it reliable."},{"i":"D4.1-L4-b","c":"D4.1","l":4,"f":"b","cl":"I know what makes a shared analysis trustworthy.","s":"What most makes a shared analysis trustworthy?","o":["Leave out labels to keep it clean.","Rely on attractive colours.","A clear source, method and honest axes","Keep the calculations hidden."],"k":2,"w":"Honest method and labelling build trust."},{"i":"D4.1-L4-c","c":"D4.1","l":4,"f":"c","cl":"I design a chart so it cannot be easily misread.","s":"A reader could misread your chart. Best fix before sharing?","o":["Remove the numbers to simplify it.","Label the axes, note the source and state the takeaway","Leave it ambiguous and hope for the best.","Add unrelated extra data to it."],"k":1,"w":"Clear labels and a stated takeaway prevent misreading."},{"i":"D4.2-L1-a","c":"D4.2","l":1,"f":"a","cl":"I know an AI figure must be checked before I rely on it.","s":"AI gives you a figure for an important decision. Right stance?","o":["Trust it fully, since a computer produced it.","Just guess a different number instead.","Check it against a reliable source before relying on it","Assume it is always wrong and ignore it."],"k":2,"w":"Verify before relying; being a computer does not make a figure right."},{"i":"D4.2-L1-b","c":"D4.2","l":1,"f":"b","cl":"I know AI-produced numbers can simply be wrong.","s":"Which is true about numbers an AI produces?","o":["They can be wrong and are worth verifying when they matter","They are always exact and reliable.","They cannot be checked by anyone.","They are never useful at all."],"k":0,"w":"They can err and warrant checking on important matters."},{"i":"D4.2-L1-c","c":"D4.2","l":1,"f":"c","cl":"I confirm an AI stat before passing it on.","s":"Best habit for an AI statistic you are about to share?","o":["Round it to a random nearby figure.","Share it unchecked, since it looks precise.","Trust it because it sounds confident.","Confirm it before sharing"],"k":3,"w":"Confirm before you pass it on; precision is not proof."},{"i":"D4.2-L2-a","c":"D4.2","l":2,"f":"a","cl":"I can spot an implausible total.","s":"AI says your 3-item shopping list totals 4,000 euros. Sensible reaction?","o":["That is clearly off; recheck the maths","Assume prices must have suddenly exploded.","Just pay it, since the AI added it up.","Accept it, since computers never make arithmetic errors."],"k":0,"w":"An implausible total signals an error to recheck."},{"i":"D4.2-L2-b","c":"D4.2","l":2,"f":"b","cl":"I can spot an impossible measurement.","s":"A tracker reports your morning walk was 900 km. Reasonable read?","o":["The tracker is precise, so accept the figure.","Believe it and celebrate the achievement.","Assume you must have walked in your sleep.","That is physically implausible; the figure is wrong"],"k":3,"w":"Physical impossibility flags a clear error."},{"i":"D4.2-L2-c","c":"D4.2","l":2,"f":"c","cl":"I sense-check the size of a number.","s":"Quickest useful check on any AI number?","o":["Did the number appear quickly?","Does its size make sense for the real situation?","Does the answer sound confident?","Is it written in bold text?"],"k":1,"w":"Sense-checking magnitude catches gross errors."},{"i":"D4.2-L3-a","c":"D4.2","l":3,"f":"a","cl":"I check an official source for an official figure.","s":"AI states a specific local tax rate for your budget. Best validation?","o":["Average a few of your own guesses.","Use the AI figure exactly as given.","Check the official tax authority's stated rate","Ask a neighbour to guess the rate."],"k":2,"w":"The authoritative source settles a specific rate."},{"i":"D4.2-L3-b","c":"D4.2","l":3,"f":"b","cl":"I compare a health figure to a reliable reference.","s":"AI gives a nutrition figure you will rely on. Strongest check?","o":["Assume all foods are roughly equal.","Trust it, since it is specific.","Compare it against the product label or an official database","Double the figure just to be safe."],"k":2,"w":"Compare to the label or an official database."},{"i":"D4.2-L3-c","c":"D4.2","l":3,"f":"c","cl":"I know what real validation is.","s":"What is proper validation of an AI data claim?","o":["Trusting it because it is specific.","Re-asking the same AI to confirm.","Confirming it against an independent authoritative source","Checking that it reads nicely."],"k":2,"w":"Independent authoritative confirmation is validation."},{"i":"D4.2-L4-a","c":"D4.2","l":4,"f":"a","cl":"I spot-check AI figures on a routine.","s":"You rely on AI to pull figures regularly. Best quality practice?","o":["Assume it simply stays fine.","Only check when it visibly fails.","Spot-check a sample against source data on a routine","Never look again once it is set up."],"k":2,"w":"Routine sampling against source data measures quality."},{"i":"D4.2-L4-b","c":"D4.2","l":4,"f":"b","cl":"I turn 'hope it's right' into 'know it's right'.","s":"What turns 'hope it is right' into 'know it is right'?","o":["Placing faith in the brand.","Applying nicer formatting.","A repeatable check against ground truth","Feeling more confident in the tool."],"k":2,"w":"A repeatable ground-truth check is what gives certainty."},{"i":"D4.2-L4-c","c":"D4.2","l":4,"f":"c","cl":"I define a source of truth for the check.","s":"Designing a check for AI figures others use, strongest element?","o":["Trusting the tool by default.","A defined source of truth and a set sampling check","No verification at all.","Checking only the layout."],"k":1,"w":"A defined truth source plus sampling makes the check real."},{"i":"D4.3-L1-a","c":"D4.3","l":1,"f":"a","cl":"I know not every source is reliable.","s":"You read a health claim online. Sensible stance?","o":["All websites are equally reliable.","The prettiest site is the most truthful.","Some sources are more trustworthy; consider who wrote it","The first result is always right."],"k":2,"w":"Reliability varies; authorship matters
